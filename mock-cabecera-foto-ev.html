<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock con imagen EV</title>
  <style>
    :root {
      --bg: #edf4ff;
      --panel: rgba(255,255,255,0.78);
      --card: rgba(255,255,255,0.9);
      --primary: #2d6efd;
      --primary-soft: rgba(45,110,253,0.08);
      --text: #162942;
      --muted: #667d9b;
      --line: rgba(121, 141, 176, 0.15);
      --shadow: 0 24px 52px rgba(15, 32, 53, 0.12);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #edf4ff 0%, #f7fbff 100%);
      font-family: Inter, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .phone {
      width: 1280px;
      max-width: 92vw;
      height: 720px;
      background: linear-gradient(180deg, #f5f9ff 0%, #ecf3ff 100%);
      border-radius: 26px;
      border: 1px solid rgba(122, 139, 172, 0.18);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .hero {
      position: relative;
      height: 470px;
      background:
        linear-gradient(180deg, rgba(146, 196, 255, 0.28), rgba(255,255,255,0.08)),
        linear-gradient(180deg, #b9dff6 0%, #dfeefc 30%, #f5f8ff 100%);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(0deg, rgba(255,255,255,0.2), rgba(255,255,255,0.2)),
        linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
    }

    .building {
      position: absolute;
      right: 0;
      top: 40px;
      width: 250px;
      height: 180px;
      background: linear-gradient(180deg, #edf6ff 0%, #dbe9f9 100%);
      border-left: 1px solid rgba(138, 160, 190, 0.1);
      opacity: 0.9;
    }

    .building::before, .building::after {
      content: "";
      position: absolute;
      inset: 18px 18px 18px 18px;
      background: repeating-linear-gradient(
        90deg,
        rgba(168, 192, 220, 0.18) 0,
        rgba(168, 192, 220, 0.18) 2px,
        rgba(255,255,255,0.4) 2px,
        rgba(255,255,255,0.4) 32px
      );
      border-radius: 8px;
    }

    .building::after {
      inset: auto 22px 28px 22px;
      height: 52px;
      background: linear-gradient(180deg, rgba(130, 148, 173, 0.12), rgba(255,255,255,0.0));
    }

    .charger {
      position: absolute;
      left: 60px;
      top: 24px;
      width: 120px;
      height: 320px;
      border-radius: 22px 22px 18px 18px;
      background: linear-gradient(180deg, #f4f8ff 0%, #edf3ff 100%);
      border: 4px solid rgba(25, 35, 49, 0.9);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.8), 0 10px 18px rgba(32, 46, 65, 0.12);
    }

    .charger::before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 26px;
      bottom: 26px;
      border-radius: 16px;
      background: radial-gradient(circle at 50% 20%, rgba(163, 194, 255, 0.55), rgba(255,255,255,0.1) 52%, rgba(0,0,0,0) 53%);
      border: 1px solid rgba(119, 136, 168, 0.16);
    }

    .charger::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 120px;
      right: -18px;
      top: 70px;
      border-radius: 18px;
      background: linear-gradient(180deg, #111827 0%, #0b1220 100%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.14);
    }

    .cable {
      position: absolute;
      left: 170px;
      top: 236px;
      width: 230px;
      height: 150px;
      border: 12px solid rgba(31, 41, 55, 0.92);
      border-top: 0;
      border-left: 0;
      border-radius: 0 0 30px 0;
      transform: rotate(8deg);
      opacity: 0.96;
    }

    .cable::before {
      content: "";
      position: absolute;
      right: -18px;
      bottom: -12px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #0c0f11 0%, #212a35 100%);
      box-shadow: 0 0 0 4px rgba(46,107,255,0.18);
    }

    .car {
      position: absolute;
      right: 90px;
      bottom: 14px;
      width: 760px;
      height: 270px;
      border-radius: 38% 28% 18% 18% / 24% 26% 16% 16%;
      background: linear-gradient(180deg, #f9fbff 0%, #ebf3ff 40%, #dfeaf9 100%);
      box-shadow: inset 0 0 0 1px rgba(138, 160, 196, 0.18), 0 18px 30px rgba(49, 68, 100, 0.06);
      transform: skewX(-10deg);
      overflow: hidden;
    }

    .car::before {
      content: "";
      position: absolute;
      inset: 68px 80px 88px 50px;
      border-radius: 32% 28% 18% 18% / 28% 26% 16% 18%;
      background: linear-gradient(180deg, rgba(234,240,249,0.96), rgba(182,198,224,0.32));
      box-shadow: inset 0 0 0 1px rgba(135, 159, 189, 0.12);
    }

    .car::after {
      content: "";
      position: absolute;
      left: 42px;
      right: 36px;
      bottom: 12px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(64,76,94,0.8), rgba(21,32,46,0.98) 70%);
      box-shadow:
        0 0 0 6px rgba(84, 98, 117, 0.10),
        270px 0 0 0 rgba(21,32,46,0.96),
        0 0 0 10px rgba(255,255,255,0.14);
    }

    .glass {
      position: absolute;
      right: 250px;
      top: 50px;
      width: 220px;
      height: 90px;
      border-radius: 42% 40% 14% 10% / 44% 60% 20% 16%;
      background: linear-gradient(180deg, rgba(21, 33, 45, 0.85), rgba(13, 22, 31, 0.7));
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
      transform: skewX(8deg);
    }

    .wheel {
      position: absolute;
      bottom: 18px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #a8b6c7 0%, #5c6f87 18%, #01070d 50%, #070d14 100%);
      box-shadow: inset 0 0 0 7px rgba(255,255,255,0.1);
    }

    .wheel.w1 { left: 175px; }
    .wheel.w2 { right: 170px; }

    .charge-port {
      position: absolute;
      left: 428px;
      bottom: 125px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #dfeeff 0%, #7dbaff 20%, #1f5afe 70%, #0e1a2a 100%);
      box-shadow: 0 0 0 8px rgba(45,110,253,0.16), 0 0 22px rgba(45,110,253,0.40);
    }

    .charge-port::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 10px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
    }

    .battery-section {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 180px;
      padding: 0 18px 18px;
      display: flex;
      align-items: end;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 1160px;
      background: rgba(255,255,255,0.78);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 16px 30px rgba(23, 39, 61, 0.05);
      backdrop-filter: blur(8px);
      padding: 18px 18px 0;
      min-height: 135px;
    }

    .title {
      font-size: clamp(28px, 3vw, 56px);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      margin: 0 0 12px;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }

    .label {
      flex: 1;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .input {
      width: 118px;
      height: 46px;
      border-radius: 12px;
      background: rgba(246,250,255,0.95);
      border: 1px solid rgba(140,160,196,0.18);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 19px;
      color: var(--text);
    }

    .unit {
      width: 70px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .meter {
      height: 14px;
      border-radius: 999px;
      background: rgba(128, 146, 179, 0.12);
      position: relative;
      overflow: hidden;
      margin-top: 18px;
    }

    .meter span {
      position: absolute;
      left: 0;
      top: 0;
      width: 58%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2d67ff 0%, #5aa3ff 52%, #4ad2bb 100%);
    }

    @media (max-width: 900px) {
      .phone { height: 620px; }
      .hero { height: 360px; }
      .card { padding: 14px 14px 0; }
      .title { font-size: 40px; }
      .charge-port { left: 360px; }
      .car { width: 560px; right: 40px; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="hero">
      <div class="building"></div>
      <div class="charger"></div>
      <div class="cable"></div>
      <div class="car">
        <div class="glass"></div>
      </div>
      <div class="wheel w1"></div>
      <div class="wheel w2"></div>
      <div class="charge-port"></div>
    </div>

    <div class="battery-section">
      <div class="card">
        <h1 class="title">Batería</h1>

        <div class="field">
          <div class="label">Capacidad</div>
          <div class="input">80,0</div>
          <div class="unit">kWh</div>
        </div>

        <div class="meter"><span></span></div>
      </div>
    </div>
  </div>
</body>
</html>
