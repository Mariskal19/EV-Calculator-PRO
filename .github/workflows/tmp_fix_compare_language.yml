name: Temporary fix compare language
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp_fix_compare_language.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch compare language refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text(encoding='utf-8')
          old = '        super.onCreate(b);\n        try {'
          new = '        super.onCreate(b);\n        // Apply the persisted language before creating any comparison views.\n        LanguageManager.applyStored(this);\n        try {'
          if old not in s:
              raise SystemExit('onCreate target not found')
          s = s.replace(old, new, 1)
          old = '    protected void onResume() {\n        super.onResume();'
          new = '    protected void onResume() {\n        super.onResume();\n        // Re-apply the selected language when returning from Configuration.\n        LanguageManager.applyStored(this);'
          if old not in s:
              raise SystemExit('onResume target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m "fix: apply selected language on compare screen"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/tmp_fix_compare_language.yml
          git commit -m "chore: remove temporary compare language workflow"
          git push
