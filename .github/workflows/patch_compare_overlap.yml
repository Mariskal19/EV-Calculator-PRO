name: Temporary compare overlap adjustment

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, 'Align compare intro card with header')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix compare card overlap without clipping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text()
          old_scroll = 'ScrollView scroll=new ScrollView(this); scroll.setFillViewport(true); scroll.setClipToPadding(false); scroll.setTranslationY(-dp(26)); LinearLayout content=new LinearLayout(this);'
          new_scroll = 'ScrollView scroll=new ScrollView(this); scroll.setFillViewport(true); scroll.setClipToPadding(false); LinearLayout.LayoutParams scrollLp=new LinearLayout.LayoutParams(-1,0,1); scrollLp.topMargin=-dp(26); LinearLayout content=new LinearLayout(this);'
          if old_scroll in s:
              s = s.replace(old_scroll,new_scroll,1)
          elif 'LinearLayout.LayoutParams scrollLp=new LinearLayout.LayoutParams(-1,0,1); scrollLp.topMargin=-dp(26);' not in s:
              raise SystemExit('Expected ScrollView pattern not found')
          old_add = 'root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));'
          new_add = 'root.addView(scroll,scrollLp);'
          if old_add in s:
              s = s.replace(old_add,new_add,1)
          elif new_add not in s:
              raise SystemExit('Expected root.addView(scroll,...) pattern not found')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'Align compare intro card with header'
          git push
