name: Fix search selection final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix selection refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text()
          old='input.post(()->rebuild());'
          new='rebuild();'
          if old not in s:
              raise SystemExit('Expected selection refresh code not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix and trigger build
        run: |
          git config user.name 'Mariskal'
          git config user.email 'Mariskal19@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'Fix compare vehicle selection refresh'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/fix-search-selection-final.yml
          git commit -m 'Remove one-time search selection fix workflow'
          git push
