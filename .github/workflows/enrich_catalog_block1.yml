name: Enrich catalog block 1

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/enrich_catalog_block1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v5

      - name: Download OpenEV source dataset
        run: git clone --depth 1 https://github.com/open-ev-data/open-ev-data-dataset.git /tmp/open-ev-data-dataset

      - name: Enrich block 1
        run: python3 scripts/enrich_catalog_block1.py

      - name: Validate catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('app/src/main/assets/catalog_es_2024_2026.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          v=d.get('vehicles',[])
          assert v, 'Catalog is empty'
          assert all(x.get('year') in (2024,2025,2026) for x in v), 'Invalid year found'
          assert all(x.get('arrivalYear') in (None,x.get('year')) for x in v), 'Invalid arrivalYear found'
          missing=[x for x in v if (x.get('batteryKwh') or 0)>0 and (x.get('wltpKm') or 0)>0 and x.get('consumptionKwh100') in (None,'',0)]
          assert not missing, f'{len(missing)} records missing consumptionKwh100'
          print(f'Catalog validated: {len(v)} vehicles')
          PY

      - name: Commit enriched catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/catalog_es_2024_2026.json
          if git diff --cached --quiet; then
            echo 'No catalog changes to commit.'
            exit 0
          fi
          git commit -m 'catalog: enrich block 1 technical data'
          git push
