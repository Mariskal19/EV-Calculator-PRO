name: Temp - search labels without power
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove power from search labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text()
          old = '.replaceAll("(?i)(?<![0-9])\\\\d+(?:[.,]\\\\d+)?\\\\s*kwh\\\\b","")'
          new = '.replaceAll("(?i)(?<![0-9])\\\\d+(?:[.,]\\\\d+)?\\\\s*kwh\\\\b","")\\n                    .replaceAll("(?i)(?<![0-9])\\\\d+(?:[.,]\\\\d+)?\\\\s*kw\\\\b","")'
          if old not in s:
              raise SystemExit('Expected searchLabel kWh cleanup not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -q 'kwh\\\\b' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          grep -q 'kw\\\\b' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'fix: hide power kW from vehicle search names'
          git push origin main
