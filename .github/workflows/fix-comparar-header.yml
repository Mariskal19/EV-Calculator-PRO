name: Fix Comparar header

on:
  push:
    paths:
      - '.github/workflows/fix-comparar-header.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Comparar header
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text(encoding='utf-8')
          old = '''        FrameLayout hero = new FrameLayout(this); hero.setLayoutParams(new LinearLayout.LayoutParams(-1, dp(156)));
        ImageView heroImage = new ImageView(this); heroImage.setScaleType(ImageView.ScaleType.CENTER_CROP); heroImage.setImageResource(R.drawable.cabecera_tema_claro); heroImage.setColorFilter(dark ? 0x88000000 : Color.TRANSPARENT, android.graphics.PorterDuff.Mode.SRC_OVER); hero.addView(heroImage, new FrameLayout.LayoutParams(-1,-1));
        View shade = new View(this); shade.setBackgroundColor(Color.argb(dark ? 145 : 90,0,18,32)); hero.addView(shade,new FrameLayout.LayoutParams(-1,-1));
        TextView back = tv("‹",40,Color.WHITE); back.setGravity(Gravity.CENTER); back.setTypeface(null,Typeface.BOLD); back.setShadowLayer(8,0,2,Color.BLACK); back.setOnClickListener(v->finish()); FrameLayout.LayoutParams bp=new FrameLayout.LayoutParams(dp(52),dp(58),Gravity.START|Gravity.TOP); bp.setMargins(dp(8),dp(10),0,0); hero.addView(back,bp);
        TextView menuButton = tv("⋮",30,Color.WHITE); menuButton.setGravity(Gravity.CENTER); menuButton.setIncludeFontPadding(false); menuButton.setTextAlignment(View.TEXT_ALIGNMENT_CENTER); menuButton.setShadowLayer(8,0,2,Color.BLACK); menuButton.setBackgroundColor(Color.TRANSPARENT); menuButton.setContentDescription(LanguageManager.t(this,"Menú")); menuButton.setOnClickListener(v->AppMenuHelper.show(this,menuButton,new AppMenuHelper.Listener(){ public boolean isDark(){return dark;} public void setDark(boolean value){if(dark!=value){dark=value;getSharedPreferences(PREFS,MODE_PRIVATE).edit().putBoolean("dark_theme",dark).apply();loadSelection();build();rebuild();}} })); FrameLayout.LayoutParams mbp=new FrameLayout.LayoutParams(dp(44),dp(52),Gravity.END|Gravity.TOP); mbp.setMargins(0,dp(10),dp(8),0); hero.addView(menuButton,mbp);
        TextView title=tv("Comparar coches",25,Color.WHITE); title.setTypeface(null,Typeface.BOLD); title.setGravity(Gravity.CENTER); title.setIncludeFontPadding(false); title.setShadowLayer(8,0,2,Color.BLACK); FrameLayout.LayoutParams tp=new FrameLayout.LayoutParams(-1,dp(52),Gravity.CENTER); tp.setMargins(dp(52),dp(10),dp(52),0); hero.addView(title,tp); root.addView(hero);'''
          new = '''        FrameLayout hero = new FrameLayout(this); hero.setLayoutParams(new LinearLayout.LayoutParams(-1, dp(260)));
        ImageView heroImage = new ImageView(this); heroImage.setImageResource(R.drawable.cabecera_ev_calculator); heroImage.setScaleType(ImageView.ScaleType.CENTER_CROP); heroImage.setAdjustViewBounds(false); heroImage.setTranslationY(-dp(10)); hero.addView(heroImage, new FrameLayout.LayoutParams(-1,-1));
        View topFade = new View(this); topFade.setBackground(new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, new int[]{Color.argb(200,0,0,0),Color.argb(80,0,0,0),Color.argb(20,0,0,0),Color.argb(0,0,0,0)})); hero.addView(topFade, new FrameLayout.LayoutParams(-1,dp(170),Gravity.TOP));
        TextView backButton = createBackButton(); backButton.setContentDescription(LanguageManager.t(this,"Volver a EV Calculator PRO Principal")); backButton.setOnClickListener(v->finish()); FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(dp(40),dp(40),Gravity.TOP|Gravity.START); bp.leftMargin=dp(14); bp.topMargin=dp(12); hero.addView(backButton,bp);
        TextView title = tv("Comparar coches",22,Color.WHITE); title.setTypeface(null,1); title.setGravity(Gravity.CENTER); title.setTextAlignment(View.TEXT_ALIGNMENT_CENTER); title.setShadowLayer(dp(4),0,dp(2),Color.argb(90,0,0,0)); FrameLayout.LayoutParams tp = new FrameLayout.LayoutParams(-1,dp(56)); tp.gravity=Gravity.TOP|Gravity.CENTER_HORIZONTAL; tp.leftMargin=dp(40); tp.rightMargin=dp(40); tp.topMargin=dp(4); hero.addView(title,tp);
        TextView menuButton = tv("⋮",30,Color.WHITE); menuButton.setGravity(Gravity.CENTER); menuButton.setIncludeFontPadding(false); menuButton.setTextAlignment(View.TEXT_ALIGNMENT_CENTER); menuButton.setPadding(0,0,0,0); menuButton.setShadowLayer(dp(4),0,dp(2),Color.argb(90,0,0,0)); menuButton.setBackgroundColor(Color.TRANSPARENT); menuButton.setContentDescription(LanguageManager.t(this,"Menú")); menuButton.setOnClickListener(v->AppMenuHelper.show(this,menuButton,new AppMenuHelper.Listener(){ public boolean isDark(){return dark;} public void setDark(boolean value){if(dark!=value){dark=value;getSharedPreferences(PREFS,MODE_PRIVATE).edit().putBoolean("dark_theme",dark).apply();loadSelection();build();rebuild();}} })); FrameLayout.LayoutParams mbp = new FrameLayout.LayoutParams(dp(40),dp(40),Gravity.TOP|Gravity.END); mbp.rightMargin=dp(14); mbp.topMargin=dp(12); hero.addView(menuButton,mbp);
        root.addView(hero);'''
          if old not in s:
              raise SystemExit('Expected Comparar header block not found; no source changes made')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit source change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'fix: align Comparar coches header' || true
          git rm .github/workflows/fix-comparar-header.yml
          git commit -m 'chore: remove temporary header workflow'
          git push