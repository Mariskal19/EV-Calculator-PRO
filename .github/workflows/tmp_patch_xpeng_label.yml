name: Temporary XPENG label correction
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tmp_patch_xpeng_label.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Correct XPENG version label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/catalog_es_2024_2026.json')
          s=p.read_text(encoding='utf-8')
          old='RWD Standard Range 190 kW FWD 66 kWh'
          new='RWD Standard Range 190 kW RWD 66 kWh'
          assert old in s
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/catalog_es_2024_2026.json
          git commit -m 'fix: correct XPENG G6 drivetrain label'
          git push
