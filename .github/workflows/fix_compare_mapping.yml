name: Fix Compare Catalog Mapping

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/fix_compare_mapping.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply mapping fix
        run: python3 .github/scripts/fix_compare_mapping.py

      - name: Verify mapping
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'batteryChemistry' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          grep -q 'charge10to80Min' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          grep -q 'acceleration0to100Sec' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          grep -q 'weightKg' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          grep -q 'trunkLiters' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          echo 'Compare catalog mapping verified.'

      - name: Commit source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- app/src/main/java/com/evchargecalculator/CompararCochesActivity.java; then
            echo 'Mapping already applied.'
            exit 0
          fi
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'fix: read current catalog fields in compare screen'
          git push origin HEAD:main

      # Keep this workflow focused on the mapping; the normal Build workflow
      # creates the release APK/AAB from the resulting main commit.
