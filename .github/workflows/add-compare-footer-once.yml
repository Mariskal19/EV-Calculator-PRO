name: Add compare footer once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add footer to compare screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text()
          marker='summary.setPadding(0,dp(18),0,dp(8));content.addView(summary,new LinearLayout.LayoutParams(-1,-2));scroll.addView(content,new ScrollView.LayoutParams(-1,-2));'
          insert='summary.setPadding(0,dp(18),0,dp(8));content.addView(summary,new LinearLayout.LayoutParams(-1,-2));String appVersion="1.0.4";try{appVersion=getPackageManager().getPackageInfo(getPackageName(),0).versionName;}catch(Exception ignored){}if(appVersion.startsWith("v")||appVersion.startsWith("V"))appVersion=appVersion.substring(1);TextView privacyLink=tv("Política de privacidad",13,dark?Color.rgb(105,175,255):blue);privacyLink.setGravity(Gravity.CENTER);privacyLink.setTypeface(null,Typeface.BOLD);privacyLink.setPadding(0,dp(4),0,dp(4));privacyLink.setClickable(true);privacyLink.setFocusable(true);privacyLink.setContentDescription("Política de privacidad");privacyLink.setOnClickListener(v->{startActivity(new Intent(Intent.ACTION_VIEW,android.net.Uri.parse("https://mariskal19.github.io/EV-Calculator-PRO-Privacy/")));});content.addView(privacyLink,new LinearLayout.LayoutParams(-1,dp(34)));TextView foot=tv("Powered by EV Calculator · v"+appVersion,12,sub());foot.setGravity(Gravity.CENTER);content.addView(foot,new LinearLayout.LayoutParams(-1,dp(28)));scroll.addView(content,new ScrollView.LayoutParams(-1,-2));'
          if marker not in s:
              raise SystemExit('compare footer insertion marker not found')
          if 'Powered by EV Calculator · v"+appVersion' in s:
              raise SystemExit('footer already present')
          p.write_text(s.replace(marker,insert,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'add compare screen footer'
          git push
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/add-compare-footer-once.yml
          git commit -m 'remove temporary compare footer workflow'
          git push
