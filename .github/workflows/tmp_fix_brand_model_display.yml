name: TMP Fix brand model display

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp_fix_brand_model_display.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove duplicated brand from model display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text(encoding='utf-8')
          old='''    private String searchLabel(Vehicle v){\n        String first=v.make+" "+v.model; StringBuilder second=new StringBuilder();'''
          new='''    private String searchLabel(Vehicle v){\n        String first=v.make;\n        String model=v.model == null ? "" : v.model.trim();\n        String brand=v.make == null ? "" : v.make.trim();\n        if(!brand.isEmpty() && model.regionMatches(true,0,brand,0,brand.length())){\n            String remainder=model.substring(brand.length()).trim();\n            if(!remainder.isEmpty()) model=remainder;\n        }\n        first=first+" "+model;\n        StringBuilder second=new StringBuilder();'''
          if old not in s: raise SystemExit('target block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('Brand/model display fix applied')
          PY
      - name: Validate Java source
        run: |
          grep -A12 'private String searchLabel' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'fix: avoid duplicated brand in compare search labels'
          git push