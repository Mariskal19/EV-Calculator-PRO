name: Catalog second pass

# Force audit rerun after verified catalog cleanup.
on:
  push:
    paths:
      - '.github/scripts/catalog_second_pass.py'
      - '.github/workflows/catalog_second_pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  second-pass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enrich missing catalog fields
        run: python .github/scripts/catalog_second_pass.py

      - name: Correct and deduplicate verified ATTO 3 EVO Spain specifications
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('app/src/main/assets/catalog_es_2024_2026.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          vehicles=data['vehicles']
          records=[v for v in vehicles if str(v.get('make','')).strip().lower()=='byd' and str(v.get('model','')).strip().upper()=='ATTO 3 EVO' and int(v.get('year') or 0)==2026]
          groups={'Design':[],'Excellence':[]}
          for v in records:
              ver=str(v.get('version','')).strip().lower()
              if ver.startswith('design'): groups['Design'].append(v)
              elif ver.startswith('excellence'): groups['Excellence'].append(v)
              else: raise RuntimeError(f'Unexpected ATTO 3 EVO version: {v.get("version")}')
          assert all(groups.values()), f'Missing ATTO 3 EVO commercial version: { {k:len(v) for k,v in groups.items()} }'
          specs={
              'Design':{'batteryKwh':74.8,'batteryType':'LFP','batteryChemistry':'LFP','powerKw':230,'drive':'RWD','drivetrain':'RWD','wltpKm':510,'consumptionKwh100':16.4,'acKw':11,'dcKw':220,'charge10to80Min':25,'acceleration0to100Sec':5.5,'trunkLiters':490,'weightKg':1880},
              'Excellence':{'batteryKwh':74.8,'batteryType':'LFP','batteryChemistry':'LFP','powerKw':330,'drive':'AWD','drivetrain':'AWD','wltpKm':470,'consumptionKwh100':17.8,'acKw':11,'dcKw':220,'charge10to80Min':25,'acceleration0to100Sec':3.9,'trunkLiters':490,'weightKg':1990},
          }
          for label, group in groups.items():
              exact=next((v for v in group if str(v.get('version','')).strip().lower()==label.lower()),None)
              keep=exact or group[0]
              for other in group:
                  if other is keep: continue
                  for k,val in other.items():
                      if keep.get(k) in (None,'') and val not in (None,''): keep[k]=val
                  vehicles.remove(other)
              keep['version']=label
              keep.update(specs[label])
              keep['source']='BYD España; ficha técnica ATTO 3 EVO 2026'
              keep['lastUpdated']='2026-09-14'
          assert sum(1 for v in vehicles if str(v.get('make','')).strip().lower()=='byd' and str(v.get('model','')).strip().upper()=='ATTO 3 EVO' and int(v.get('year') or 0)==2026)==2
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print('Corrected and normalized ATTO 3 EVO records: Design, Excellence; duplicate records removed:', len(records)-2)
          PY

      - name: Correct verified BYD SEALION 7 Spain specifications
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('app/src/main/assets/catalog_es_2024_2026.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          found=[]
          for v in data['vehicles']:
              if str(v.get('make','')).strip().lower() != 'byd': continue
              if str(v.get('model','')).strip().upper() != 'SEALION 7': continue
              if int(v.get('year') or 0) != 2024: continue
              ver=str(v.get('version','')).strip().lower()
              if ver.startswith('comfort'):
                  specs={'batteryKwh':82.5,'usableBatteryKwh':82.5,'batteryType':'LFP','batteryChemistry':'LFP','powerKw':230,'drive':'RWD','drivetrain':'RWD','wltpKm':482,'consumptionKwh100':17.1,'acKw':11,'dcKw':150,'charge10to80Min':32,'acceleration0to100Sec':6.7,'trunkLiters':520}
                  label='Comfort'
              elif ver.startswith('design awd'):
                  specs={'batteryKwh':82.5,'usableBatteryKwh':82.5,'batteryType':'LFP','batteryChemistry':'LFP','powerKw':390,'drive':'AWD','drivetrain':'AWD','wltpKm':456,'consumptionKwh100':18.1,'acKw':11,'dcKw':150,'charge10to80Min':32,'acceleration0to100Sec':4.5,'trunkLiters':520}
                  label='Design AWD'
              elif ver.startswith('excellence awd'):
                  specs={'batteryKwh':91.3,'usableBatteryKwh':91.3,'batteryType':'LFP','batteryChemistry':'LFP','powerKw':390,'drive':'AWD','drivetrain':'AWD','wltpKm':502,'consumptionKwh100':18.2,'acKw':11,'dcKw':230,'charge10to80Min':24,'acceleration0to100Sec':4.5,'trunkLiters':520}
                  label='Excellence AWD'
              else:
                  continue
              v.update(specs)
              v['source']='BYD España / BYD Europe — SEALION 7 2024'
              v['lastUpdated']='2026-09-14'
              found.append(label)
          assert sorted(found)==['Comfort','Design AWD','Excellence AWD'], f'Unexpected SEALION 7 records: {found}'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print('Corrected verified SEALION 7 records:', ', '.join(found))
          PY

      - name: Correct verified Ford Explorer 2024 duplicate records
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          p=Path('app/src/main/assets/catalog_es_2024_2026.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          vehicles=data['vehicles']
          def norm(s):
              s=str(s or '').lower().strip()
              s=s.replace('á','a').replace('é','e').replace('í','i').replace('ó','o').replace('ú','u')
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()
          groups={}
          for v in vehicles:
              key=(norm(v.get('make')),norm(v.get('model')),int(v.get('year') or 0),norm(v.get('version')))
              groups.setdefault(key,[]).append(v)
          corrected=removed=0
          for key,records in list(groups.items()):
              make,model,year,version=key
              if make!='ford' or model!='explorer' or year!=2024 or len(records)<=1: continue
              if 'rango extendido awd' in version: desired_battery,desired_drive=77.0,'AWD'
              elif 'rango extendido rwd' in version: desired_battery,desired_drive=79.0,'RWD'
              else: raise RuntimeError(f'Unexpected Ford Explorer duplicate: {key}')
              candidates=[v for v in records if float(v.get('batteryKwh') or -1)==desired_battery]
              if len(candidates)!=1: raise RuntimeError(f'Ford Explorer duplicate does not have exactly one verified record: {key} specs={[v.get("batteryKwh") for v in records]}')
              keep=candidates[0]
              keep.update({'batteryKwh':desired_battery,'usableBatteryKwh':desired_battery,'drive':desired_drive,'drivetrain':desired_drive,'batteryType':keep.get('batteryType') or 'Li-ion','source':'Ford España — Explorer eléctrico 2024','lastUpdated':'2026-09-14'})
              for other in records:
                  if other is keep: continue
                  for k,val in other.items():
                      if keep.get(k) in (None,'') and val not in (None,''): keep[k]=val
                  vehicles.remove(other); removed+=1
              corrected+=1
          if corrected!=2 or removed!=2: raise RuntimeError(f'Expected 2 Ford Explorer duplicate groups and 2 removals; got groups={corrected}, removals={removed}')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print('Ford Explorer correction complete:', corrected, 'groups corrected,', removed, 'duplicate records removed')
          PY

      - name: Audit catalog for duplicate commercial records
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          p=Path('app/src/main/assets/catalog_es_2024_2026.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          vehicles=data['vehicles']
          keys=defaultdict(list)
          for v in vehicles:
              key=(str(v.get('make','')).strip().lower(),str(v.get('model','')).strip().lower(),int(v.get('year') or 0),str(v.get('version','')).strip().lower())
              keys[key].append(v)
          duplicates={k:vs for k,vs in keys.items() if len(vs)>1}
          print('AUDIT vehicle count:',len(vehicles))
          print('AUDIT exact commercial duplicates:',len(duplicates))
          assert not duplicates, f'Exact commercial duplicates remain: {list(duplicates)}'
          ids=defaultdict(list)
          for v in vehicles:
              if v.get('id'): ids[v['id']].append(v)
          duplicate_ids={k:vs for k,vs in ids.items() if len(vs)>1}
          print('AUDIT duplicate IDs:',len(duplicate_ids))
          assert not duplicate_ids, f'Duplicate IDs remain: {list(duplicate_ids)}'
          PY

      - name: Validate catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('app/src/main/assets/catalog_es_2024_2026.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          vehicles=data.get('vehicles')
          assert isinstance(vehicles,list), 'vehicles array missing'
          assert len(vehicles)==607, f'unexpected vehicle count after verified duplicate cleanup: {len(vehicles)}'
          for i,v in enumerate(vehicles): assert v.get('make') and v.get('model') and v.get('version'), f'invalid vehicle at index {i}'
          sealion=[v for v in vehicles if str(v.get('make','')).strip().lower()=='byd' and str(v.get('model','')).strip().upper()=='SEALION 7' and int(v.get('year') or 0)==2024]
          assert len(sealion)==3, f'Expected exactly 3 SEALION 7 Spain records, got {len(sealion)}'
          for v in sealion:
              ver=str(v.get('version')).strip().lower()
              if ver.startswith('comfort'): assert (v.get('batteryKwh'),v.get('wltpKm'),v.get('drive'),v.get('powerKw'))==(82.5,482,'RWD',230)
              elif ver.startswith('design awd'): assert (v.get('batteryKwh'),v.get('wltpKm'),v.get('drive'),v.get('powerKw'))==(82.5,456,'AWD',390)
              elif ver.startswith('excellence awd'): assert (v.get('batteryKwh'),v.get('wltpKm'),v.get('drive'),v.get('powerKw'))==(91.3,502,'AWD',390)
              else: raise AssertionError(f'Unexpected SEALION 7 version: {v.get("version")}')
          atto=[v for v in vehicles if str(v.get('make','')).strip().lower()=='byd' and str(v.get('model','')).strip().upper()=='ATTO 3 EVO' and int(v.get('year') or 0)==2026]
          assert len(atto)==2, f'Expected exactly 2 ATTO 3 EVO Spain records, got {len(atto)}'
          byver={str(v.get('version')).strip():v for v in atto}
          assert set(byver)=={'Design','Excellence'}, f'Unexpected ATTO 3 EVO versions: {set(byver)}'
          assert (byver['Design'].get('batteryKwh'),byver['Design'].get('wltpKm'),byver['Design'].get('consumptionKwh100'),byver['Design'].get('drive'),byver['Design'].get('powerKw'))==(74.8,510,16.4,'RWD',230)
          assert (byver['Excellence'].get('batteryKwh'),byver['Excellence'].get('wltpKm'),byver['Excellence'].get('consumptionKwh100'),byver['Excellence'].get('drive'),byver['Excellence'].get('powerKw'))==(74.8,470,17.8,'AWD',330)
          print('Catalog validation OK:',len(vehicles),'vehicles; duplicates=0; duplicate IDs=0; SEALION 7=3; ATTO 3 EVO=2')
          PY

      - name: Commit catalog if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/catalog_es_2024_2026.json
          if git diff --cached --quiet; then echo 'No catalog changes to commit.'; else git commit -m 'catalog: correct verified BYD and Ford specifications'; git push origin main; fi
