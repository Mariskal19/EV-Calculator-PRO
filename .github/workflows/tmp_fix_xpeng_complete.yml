name: Temporary complete XPENG catalog audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tmp_fix_xpeng_complete.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild complete XPENG ES catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('app/src/main/assets/catalog_es_2024_2026.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          old=data['vehicles']
          vehicles=[v for v in old if v.get('make','').strip().lower() not in ('xpeng','xpeng motors')]
          def v(model, version, year, battery, usable, chemistry, power, drive, wltp, cons, ac, dc, charge, accel, trunk, weight, price):
              return {
                'make':'XPeng','model':model,'year':year,'arrivalYear':year,'market':'ES','version':version,
                'batteryKwh':battery,'usableBatteryKwh':usable,'batteryType':'LFP' if chemistry=='LFP' else 'NMC','batteryChemistry':chemistry,
                'powerKw':power,'drive':drive,'drivetrain':drive,'wltpKm':wltp,'consumptionKwh100':cons,
                'acKw':ac,'dcKw':dc,'charge10to80Min':charge,'acceleration0to100Sec':accel,'trunkLiters':trunk,'weightKg':weight,
                'price':price,'currency':'EUR','photo':None,
                'source':'XPENG official + KM77 (Spain historical/current technical data)','lastUpdated':'2026-09-11'
              }
          xp=[]
          # G6 original Spain launch, 2024
          xp += [
            v('G6','RWD Standard Range 190 kW FWD 66 kWh',2024,66,66,'LFP',190,'RWD',435,17.5,11,215,20,6.6,571,2025,43890),
            v('G6','RWD Long Range 210 kW RWD 87.5 kWh',2024,87.5,87.5,'NMC',210,'RWD',570,17.5,11,280,20,6.2,571,2025,49990),
            v('G6','AWD Performance 350 kW AWD 87.5 kWh',2024,87.5,87.5,'NMC',350,'AWD',550,17.9,11,280,20,4.1,571,2120,56500),
          ]
          # G6 renewed generation, Spain arrival 2025
          xp += [
            v('G6','RWD Long Range 218 kW RWD 80.8 kWh',2025,80.8,80.0,'LFP',218,'RWD',525,17.5,11,451,12,6.7,571,2115,47083),
            v('G6','AWD Performance 358 kW AWD 80.8 kWh',2025,80.8,80.0,'LFP',358,'AWD',510,18.4,11,451,12,4.1,571,2220,53083),
          ]
          # G6 Standard Range arrived Spain in 2026
          xp += [
            v('G6','RWD Standard Range 185 kW RWD 68.5 kWh',2026,68.5,67.8,'LFP',185,'RWD',455,17.3,11,382,12,6.9,571,2065,43083),
          ]
          # G9 original Spain launch, 2024
          xp += [
            v('G9','RWD Standard Range 230 kW RWD 78.2 kWh',2024,78.2,75.8,'LFP',230,'RWD',460,19.4,11,260,20,6.4,660,2235,58970),
            v('G9','RWD Long Range 230 kW RWD 98 kWh',2024,98.0,93.1,'NMC',230,'RWD',570,19.4,11,300,20,6.4,660,2210,63990),
            v('G9','AWD Performance 405 kW AWD 98 kWh',2024,98.0,93.1,'NMC',405,'AWD',520,21.3,11,300,20,3.9,660,2340,72550),
          ]
          # G9 renewed generation, Spain arrival 2025
          xp += [
            v('G9','RWD Standard Range 258 kW RWD 79 kWh',2025,79.0,78.2,'LFP',258,'RWD',502,18.4,11,445,12,6.6,660,2235,59083),
            v('G9','RWD Long Range 258 kW RWD 93.1 kWh',2025,93.1,92.2,'LFP',258,'RWD',585,18.6,11,525,12,6.4,660,2315,63083),
            v('G9','AWD Performance 423 kW AWD 93.1 kWh',2025,93.1,92.2,'LFP',423,'AWD',540,20.1,11,525,12,4.2,660,2420,73083),
          ]
          # P7 original Spanish launch, 2024: 3 versions
          xp += [
            v('P7','RWD Long Range 203 kW RWD 86.2 kWh',2024,86.2,82.7,'NMC',203,'RWD',576,16.8,11,175,29,6.7,440,2020,51990),
            v('P7','AWD Performance 348 kW AWD 86.2 kWh',2024,86.2,82.7,'NMC',348,'AWD',505,19.2,11,175,29,4.1,440,2140,59990),
            v('P7','AWD Wing Edition 348 kW AWD 86.2 kWh',2024,86.2,82.7,'NMC',348,'AWD',505,19.2,11,175,29,4.1,440,2140,64990),
          ]
          # P7+ Spain arrival May 2026
          xp += [
            v('P7+','RWD Standard Range 180 kW RWD 61.7 kWh',2026,61.7,None,'LFP',180,'RWD',455,15.2,11,350,20,6.9,573,1999,44400),
            v('P7+','RWD Long Range 230 kW RWD 74.9 kWh',2026,74.9,None,'LFP',230,'RWD',530,16.4,11,446,12,6.2,573,2100,48400),
            v('P7+','AWD Performance 370 kW AWD 74.9 kWh',2026,74.9,None,'LFP',370,'AWD',500,17.4,11,446,12,4.3,573,2200,54400),
          ]
          assert len(xp)==18
          data['vehicles']=vehicles+xp
          # deterministic catalog order
          data['vehicles'].sort(key=lambda x:(x.get('market',''),x.get('make',''),x.get('model',''),x.get('year',0),x.get('version','')))
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('XPENG records:',sum(1 for x in data['vehicles'] if x.get('make')=='XPeng'))
          print('Total records:',len(data['vehicles']))
          for x in data['vehicles']:
              if x.get('make')=='XPeng': print(x['model'],x['year'],x['version'])
          PY
      - name: Validate XPENG records
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('app/src/main/assets/catalog_es_2024_2026.json',encoding='utf-8'))
          xp=[x for x in d['vehicles'] if x.get('make')=='XPeng']
          assert len(xp)==18, len(xp)
          assert sorted((x['model'],x['year']) for x in xp).count(('G6',2024))==3
          assert sorted((x['model'],x['year']) for x in xp).count(('G6',2025))==2
          assert sorted((x['model'],x['year']) for x in xp).count(('G6',2026))==1
          assert sorted((x['model'],x['year']) for x in xp).count(('G9',2024))==3
          assert sorted((x['model'],x['year']) for x in xp).count(('G9',2025))==3
          assert sorted((x['model'],x['year']) for x in xp).count(('P7',2024))==3
          assert sorted((x['model'],x['year']) for x in xp).count(('P7+',2026))==3
          for x in xp:
              for k in ['batteryKwh','powerKw','wltpKm','consumptionKwh100','acKw','dcKw','acceleration0to100Sec','trunkLiters','weightKg']:
                  assert k in x and x[k] is not None, (x['model'],x['year'],x['version'],k)
          print('XPENG exhaustive validation OK')
          PY
      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/catalog_es_2024_2026.json
          git commit -m 'fix: complete XPENG Spanish catalog data'
          git push
