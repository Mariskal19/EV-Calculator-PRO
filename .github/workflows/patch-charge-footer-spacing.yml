name: Patch Charge footer spacing

on:
  push:
    paths:
      - '.github/workflows/patch-charge-footer-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Charge footer spacing to Principal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/MainActivity.java')
          s = p.read_text()
          old_padding = 'root.setPadding(0,dp(36),0,dp(68));'
          new_padding = 'root.setPadding(0,dp(36),0,dp(16));'
          if old_padding not in s:
              raise SystemExit('Expected Charge root padding not found; no changes made')
          s = s.replace(old_padding, new_padding, 1)
          old_footer = 'root.addView(foot,new LinearLayout.LayoutParams(-1,dp(28)));space(8);setup();'
          new_footer = 'root.addView(foot,new LinearLayout.LayoutParams(-1,dp(28)));setup();'
          if old_footer not in s:
              raise SystemExit('Expected Charge footer spacing not found; no changes made')
          s = s.replace(old_footer, new_footer, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/MainActivity.java
          git rm .github/workflows/patch-charge-footer-spacing.yml
          git commit -m 'Charge: igualar margen inferior al principal'
          git push
