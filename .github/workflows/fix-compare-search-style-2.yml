name: Temporary Compare Search Source Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('indexOf("\n");','indexOf("\\n");')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-compare-search-style-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java .github/workflows/fix-compare-search-style-2.yml
          git commit -m 'fix: correct compare search source'
          git push
