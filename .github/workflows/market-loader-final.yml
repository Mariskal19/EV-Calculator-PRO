name: Final cross-market catalog loader
on:
  push:
    branches: [feature/automatizacion-coches]
    paths:
      - 'MARKET_LOADER_TRIGGER_FINAL.txt'
      - '.github/workflows/market-loader-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load market catalog
        run: |
          if ! grep -q 'vehicle_market_additions.json' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java; then
            perl -0pi -e 's/normalizeVehicleList\(\);/loadAssetVehicles("vehicle_market_additions.json",false);normalizeVehicleList();/' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          fi
          grep -q 'vehicle_market_additions.json' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          rm -f .github/workflows/market-loader-final.yml MARKET_LOADER_TRIGGER_FINAL.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Load cross-market vehicles in compare cars'
          git pull --rebase origin feature/automatizacion-coches
          git push origin feature/automatizacion-coches
