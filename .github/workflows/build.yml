name: Build EV Charge Calculator

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+[\'\"]([^\'\"]+)[\'\"].*$/\1/p" app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not determine versionName from app/build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App version: $version"

          echo "Dynamic artifact naming verified from versionName=$version"

      - name: Build Release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          if [ -z "$apk" ]; then
            echo "No Release APK found under app/build/outputs/apk"
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi
          echo "Release APK found: $apk"
          cp "$apk" "release/EVChargeCalculator-v${VERSION}.apk"
          zip -r "release/EVChargeCalculator-v${VERSION}.zip" . \
            -x '.git/*' '.gradle/*' 'app/build/*' 'release/*'

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: EVChargeCalculator-v${{ steps.version.outputs.version }}
          path: release/EVChargeCalculator-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EVChargeCalculator-v${{ steps.version.outputs.version }}-source
          path: release/EVChargeCalculator-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
