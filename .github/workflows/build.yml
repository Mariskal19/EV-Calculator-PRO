name: Build EV Charge Calculator

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Rename APK
        run: |
          set -euo pipefail
          mkdir -p release
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          if [ -z "$apk" ]; then
            echo "No Release APK found under app/build/outputs/apk"
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi
          echo "Release APK found: $apk"
          cp "$apk" release/EVChargeCalculator-v1.0.15.apk

      - name: Create project ZIP
        run: |
          zip -r release/EVChargeCalculator-v1.0.15.zip . \
            -x '.git/*' '.gradle/*' 'app/build/*' 'release/*'

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EVChargeCalculator-v1.0.15
          path: release/EVChargeCalculator-v1.0.15.apk
          if-no-files-found: error

      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EVChargeCalculator-v1.0.15-source
          path: release/EVChargeCalculator-v1.0.15.zip
          if-no-files-found: error
