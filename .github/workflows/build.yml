name: Build EV Calculator

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EV_CALCULATOR_KEYSTORE_BASE64: ${{ secrets.EV_CALCULATOR_KEYSTORE_BASE64 }}
      EV_CALCULATOR_KEYSTORE_PASSWORD: ${{ secrets.EV_CALCULATOR_KEYSTORE_PASSWORD }}
      EV_CALCULATOR_KEY_ALIAS: ${{ secrets.EV_CALCULATOR_KEY_ALIAS }}
      EV_CALCULATOR_KEY_PASSWORD: ${{ secrets.EV_CALCULATOR_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Normalize departure warning card height
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/MainActivity.java')
          s = p.read_text()
          old = 'statusBox.addView(textCol,new LinearLayout.LayoutParams(0,dp(64),1)); statusBox.getLayoutParams().height=dp(84);'
          new = 'statusBox.addView(textCol,new LinearLayout.LayoutParams(0,dp(56),1)); statusBox.getLayoutParams().height=dp(78);'
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('Warning departure card normalized to 78dp.')
          else:
              print('Warning departure card already normalized; no source change needed.')
          PY
          if git diff --quiet -- app/src/main/java/com/evchargecalculator/MainActivity.java; then
            echo "No source change to commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/com/evchargecalculator/MainActivity.java
            git commit -m 'fix: keep warning departure card height consistent'
            git push
          fi

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${EV_CALCULATOR_KEYSTORE_BASE64:-}" ]; then
            echo "$EV_CALCULATOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/evcalculator-upload.jks"
            test -s "$RUNNER_TEMP/evcalculator-upload.jks"
            echo "Release upload keystore configured."
          else
            echo "No upload keystore configured yet; release build will use the temporary debug fallback."
          fi

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+[\'\"]([^\'\"]+)[\'\"].*$/\1/p" app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not determine versionName from app/build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App version: $version"

      - name: Build Release APK and AAB
        env:
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/evcalculator-upload.jks
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Verify release signing mode
        shell: bash
        run: |
          if [ -n "${EV_CALCULATOR_KEYSTORE_BASE64:-}" ]; then
            echo "Release build configured with the Google Play upload key."
          else
            echo "WARNING: Google Play upload key is not configured yet; release artifacts use the temporary debug signing fallback."
          fi

      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          artifact_version="v${VERSION#v}"

          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          if [ -z "$apk" ]; then
            echo "No Release APK found under app/build/outputs/apk"
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi

          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          if [ -z "$aab" ]; then
            echo "No Release AAB found under app/build/outputs/bundle"
            find app/build/outputs/bundle -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "Release APK found: $apk"
          echo "Release AAB found: $aab"
          cp "$apk" "release/EV Calculator-${artifact_version}.apk"
          cp "$aab" "release/EV Calculator-${artifact_version}.aab"

          zip -r "release/EV Calculator-${artifact_version}.zip" . \
            -x '.git/*' '.gradle/*' 'app/build/*' 'release/*'

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: EV Calculator-v${{ steps.version.outputs.version }}
          path: release/EV Calculator-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v6
        with:
          name: EV Calculator-v${{ steps.version.outputs.version }}-aab
          path: release/EV Calculator-v${{ steps.version.outputs.version }}.aab
          if-no-files-found: error

      - name: Upload project ZIP
        uses: actions/upload-artifact@v6
        with:
          name: EV Calculator-v${{ steps.version.outputs.version }}-source
          path: release/EV Calculator-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
