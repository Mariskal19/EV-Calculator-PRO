name: Build EV Calculator PRO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EV_CALCULATOR_KEYSTORE_BASE64: ${{ secrets.EV_CALCULATOR_KEYSTORE_BASE64 }}
      EV_CALCULATOR_KEYSTORE_PASSWORD: ${{ secrets.EV_CALCULATOR_KEYSTORE_PASSWORD }}
      EV_CALCULATOR_KEY_ALIAS: ${{ secrets.EV_CALCULATOR_KEY_ALIAS }}
      EV_CALCULATOR_KEY_PASSWORD: ${{ secrets.EV_CALCULATOR_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${EV_CALCULATOR_KEYSTORE_BASE64:-}" ]; then
            echo "$EV_CALCULATOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/evcalculator-upload.jks"
            test -s "$RUNNER_TEMP/evcalculator-upload.jks"
            echo "Release upload keystore configured."
          else
            echo "No upload keystore configured; release build will use the temporary debug fallback for testing only."
          fi

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+[\'\"]([^\'\"]+)[\'\"].*$/\1/p" app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not determine versionName from app/build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App version: $version"

      - name: Build Release APK and AAB
        env:
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/evcalculator-upload.jks
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Verify release signing mode
        shell: bash
        run: |
          if [ -n "${EV_CALCULATOR_KEYSTORE_BASE64:-}" ]; then
            echo "Release build configured with the Google Play upload key."
          else
            echo "WARNING: upload key is not configured; artifacts are for testing only."
          fi

      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          artifact_version="v${VERSION#v}"

          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          if [ -z "$apk" ]; then
            echo "No Release APK found under app/build/outputs/apk"
            find app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi

          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          if [ -z "$aab" ]; then
            echo "No Release AAB found under app/build/outputs/bundle"
            find app/build/outputs/bundle -maxdepth 4 -type f -print || true
            exit 1
          fi

          cp "$apk" "release/EV-Calculator-PRO-${artifact_version}.apk"
          cp "$aab" "release/EV-Calculator-PRO-${artifact_version}.aab"

          zip -r "release/EV-Calculator-PRO-${artifact_version}.zip" . \
            -x '.git/*' '.gradle/*' 'app/build/*' 'release/*'

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}-aab
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.aab
          if-no-files-found: error

      - name: Upload project ZIP
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}-source
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
