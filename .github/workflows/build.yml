name: Build EV Calculator PRO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'app/src/main/assets/catalog_es_2024_2026.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EV_CALCULATOR_KEYSTORE_BASE64: ${{ secrets.EV_CALCULATOR_KEYSTORE_BASE64 }}
      EV_CALCULATOR_KEYSTORE_PASSWORD: ${{ secrets.EV_CALCULATOR_KEYSTORE_PASSWORD }}
      EV_CALCULATOR_KEY_ALIAS: ${{ secrets.EV_CALCULATOR_KEY_ALIAS }}
      EV_CALCULATOR_KEY_PASSWORD: ${{ secrets.EV_CALCULATOR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Apply search virtualization patch
        run: python3 .github/scripts/patch_search_virtualization.py

      - name: Verify final Spanish catalog
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/catalog_es_2024_2026.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('app/src/main/assets/catalog_es_2024_2026.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          vehicles = data.get('vehicles')
          if not isinstance(vehicles, list) or not vehicles:
              raise SystemExit('Catalog is missing or empty')
          invalid = [v for v in vehicles if v.get('year') not in (2024, 2025, 2026)]
          if invalid:
              raise SystemExit(f'Catalog contains {len(invalid)} vehicles outside 2024-2026')
          missing = [v for v in vehicles if (v.get('batteryKwh') or 0) > 0 and (v.get('wltpKm') or 0) > 0 and v.get('consumptionKwh100') in (None, '', 0)]
          if missing:
              raise SystemExit(f'Catalog contains {len(missing)} vehicles without consumptionKwh100')
          print(f'Final Spanish catalog OK: {len(vehicles)} vehicles')
          PY

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EV_CALCULATOR_KEYSTORE_BASE64:-}" || { echo "ERROR: EV_CALCULATOR_KEYSTORE_BASE64 is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEYSTORE_PASSWORD:-}" || { echo "ERROR: EV_CALCULATOR_KEYSTORE_PASSWORD is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEY_ALIAS:-}" || { echo "ERROR: EV_CALCULATOR_KEY_ALIAS is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEY_PASSWORD:-}" || { echo "ERROR: EV_CALCULATOR_KEY_PASSWORD is not configured."; exit 1; }
          echo "$EV_CALCULATOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/evcalculator-upload.jks"
          test -s "$RUNNER_TEMP/evcalculator-upload.jks"
          echo "Release upload keystore configured."

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*$/\1/p" app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not determine versionName from app/build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App version: $version"

      - name: Build Release APK and AAB
        env:
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/evcalculator-upload.jks
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          test -n "$apk" || { echo "No Release APK found."; exit 1; }
          test -n "$aab" || { echo "No Release AAB found."; exit 1; }
          echo "Release APK: $apk"
          echo "Release AAB: $aab"

      - name: Persist optimized search source
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- app/src/main/java/com/evchargecalculator/CompararCochesActivity.java; then
            echo "Search source already matches optimized version."
            exit 0
          fi

          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m "Virtualize compare car search results"

          # main may have moved while the build was running. Rebase the small
          # generated-source commit onto the current remote main before pushing.
          # If another change lands during the retry, leave the build successful
          # and let the next main build persist the generated source.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Optimized search source persisted successfully."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Persistence attempt $attempt could not update main; retrying..."
            sleep 2
          done
          echo "WARNING: optimized search source could not be persisted this run; APK/AAB build will continue."

      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          artifact_version="v${VERSION#v}"
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          cp "$apk" "release/EV-Calculator-PRO-${artifact_version}.apk"
          cp "$aab" "release/EV-Calculator-PRO-${artifact_version}.aab"

      - name: Publish GitHub Release with APK and AAB
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifact_version="v${VERSION#v}"
          tag="build-${artifact_version}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            release/EV-Calculator-PRO-${artifact_version}.aab \
            release/EV-Calculator-PRO-${artifact_version}.apk \
            --target "$GITHUB_SHA" \
            --title "EV Calculator PRO ${artifact_version} build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated release build from main. Commit: ${GITHUB_SHA}"
