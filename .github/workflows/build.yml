name: Build EV Calculator PRO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'app/src/main/assets/catalog_es_2024_2026.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EV_CALCULATOR_KEYSTORE_BASE64: ${{ secrets.EV_CALCULATOR_KEYSTORE_BASE64 }}
      EV_CALCULATOR_KEYSTORE_PASSWORD: ${{ secrets.EV_CALCULATOR_KEYSTORE_PASSWORD }}
      EV_CALCULATOR_KEY_ALIAS: ${{ secrets.EV_CALCULATOR_KEY_ALIAS }}
      EV_CALCULATOR_KEY_PASSWORD: ${{ secrets.EV_CALCULATOR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply comparison card redesign
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'    private View carCard\(Vehicle v\)\{.*?\n    private void remove\(String id\)', re.S)
          replacement = '''    private View carCard(Vehicle v){
          LinearLayout c=new LinearLayout(this);
          c.setOrientation(LinearLayout.VERTICAL);
          c.setGravity(Gravity.CENTER_HORIZONTAL);
          c.setPadding(dp(10),dp(11),dp(10),dp(8));
          c.setBackground(strokeBg(dark?Color.rgb(18,32,45):Color.WHITE,dark?Color.rgb(49,72,91):Color.rgb(214,225,237),18));

          TextView make=tv(v.make,11,blue);
          make.setTypeface(null,Typeface.BOLD);
          make.setGravity(Gravity.CENTER);
          make.setAllCaps(true);
          make.setLetterSpacing(0.03f);
          c.addView(make,new LinearLayout.LayoutParams(-1,dp(22)));

          TextView model=tv(v.model,17,text());
          model.setTypeface(null,Typeface.BOLD);
          model.setGravity(Gravity.CENTER);
          model.setMaxLines(2);
          c.addView(model,new LinearLayout.LayoutParams(-1,dp(40)));

          LinearLayout meta=new LinearLayout(this);
          meta.setOrientation(LinearLayout.HORIZONTAL);
          meta.setGravity(Gravity.CENTER);
          TextView year=tv(v.year>0?String.valueOf(v.year):"",11,sub());
          year.setGravity(Gravity.CENTER);
          year.setTypeface(null,Typeface.BOLD);
          year.setBackground(strokeBg(dark?Color.rgb(20,38,52):Color.rgb(242,247,253),dark?Color.rgb(48,73,94):Color.rgb(220,229,239),10));
          meta.addView(year,new LinearLayout.LayoutParams(0,dp(26),1));
          TextView market=tv(marketLabel(v.market),10,sub());
          market.setGravity(Gravity.CENTER);
          LinearLayout.LayoutParams marketLp=new LinearLayout.LayoutParams(0,dp(26),1);
          marketLp.setMargins(dp(5),0,0,0);
          meta.addView(market,marketLp);
          c.addView(meta,new LinearLayout.LayoutParams(-1,dp(30)));

          TextView ver=tv(v.version,11,sub());
          ver.setGravity(Gravity.CENTER);
          ver.setMaxLines(2);
          ver.setEllipsize(android.text.TextUtils.TruncateAt.END);
          ver.setPadding(dp(2),dp(2),dp(2),0);
          c.addView(ver,new LinearLayout.LayoutParams(-1,dp(38)));

          LinearLayout specs=new LinearLayout(this);
          specs.setOrientation(LinearLayout.HORIZONTAL);
          specs.setGravity(Gravity.CENTER);
          if(v.batteryKwh>0){
              TextView b=tv(fmt(v.batteryKwh)+" kWh",10,text());
              b.setGravity(Gravity.CENTER);
              b.setBackground(bg(dark?Color.rgb(20,42,58):Color.rgb(238,245,255),10));
              specs.addView(b,new LinearLayout.LayoutParams(0,dp(25),1));
          }
          if(v.wltpKm>0){
              TextView r=tv(String.format(Locale.US,"%.0f km",v.wltpKm),10,text());
              r.setGravity(Gravity.CENTER);
              r.setBackground(bg(dark?Color.rgb(20,42,58):Color.rgb(238,245,255),10));
              LinearLayout.LayoutParams rp=new LinearLayout.LayoutParams(0,dp(25),1);
              rp.setMargins(dp(5),0,0,0);
              specs.addView(r,rp);
          }
          if(specs.getChildCount()>0)c.addView(specs,new LinearLayout.LayoutParams(-1,dp(29)));

          TextView rem=tv("Quitar",11,Color.rgb(210,70,70));
          rem.setGravity(Gravity.CENTER);
          rem.setTypeface(null,Typeface.BOLD);
          rem.setPadding(0,dp(3),0,0);
          rem.setOnClickListener(x->remove(v.id));
          c.addView(rem,new LinearLayout.LayoutParams(-1,dp(27)));
          return c;
      }
      private void remove(String id)'''
          ns, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('Could not locate carCard method for redesign')
          p.write_text(ns, encoding='utf-8')
          PY

          # Keep the permanent workflow unchanged; only the Java redesign is committed.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/build.yml
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          if git diff --cached --quiet; then
            echo "No comparison card changes were necessary."
            exit 0
          fi
          git commit -m "Redesign comparison vehicle cards"
          git push origin HEAD:main

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Verify final Spanish catalog
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/catalog_es_2024_2026.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('app/src/main/assets/catalog_es_2024_2026.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          vehicles = data.get('vehicles')
          if not isinstance(vehicles, list) or not vehicles:
              raise SystemExit('Catalog is missing or empty')
          invalid = [v for v in vehicles if v.get('year') not in (2024, 2025, 2026)]
          if invalid:
              raise SystemExit(f'Catalog contains {len(invalid)} vehicles outside 2024-2026')
          missing = [v for v in vehicles if (v.get('batteryKwh') or 0) > 0 and (v.get('wltpKm') or 0) > 0 and v.get('consumptionKwh100') in (None, '', 0)]
          if missing:
              raise SystemExit(f'Catalog contains {len(missing)} vehicles without consumptionKwh100')
          print(f'Final Spanish catalog OK: {len(vehicles)} vehicles')
          PY

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EV_CALCULATOR_KEYSTORE_BASE64:-}" || { echo "ERROR: EV_CALCULATOR_KEYSTORE_BASE64 is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEYSTORE_PASSWORD:-}" || { echo "ERROR: EV_CALCULATOR_KEYSTORE_PASSWORD is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEY_ALIAS:-}" || { echo "ERROR: EV_CALCULATOR_KEY_ALIAS is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEY_PASSWORD:-}" || { echo "ERROR: EV_CALCULATOR_KEY_PASSWORD is not configured."; exit 1; }
          echo "$EV_CALCULATOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/evcalculator-upload.jks"
          test -s "$RUNNER_TEMP/evcalculator-upload.jks"
          echo "Release upload keystore configured."

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*$/\1/p" app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not determine versionName from app/build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App version: $version"

      - name: Build Release APK and AAB
        env:
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/evcalculator-upload.jks
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          test -n "$apk" || { echo "No Release APK found."; exit 1; }
          test -n "$aab" || { echo "No Release AAB found."; exit 1; }
          echo "Release APK: $apk"
          echo "Release AAB: $aab"

      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          artifact_version="v${VERSION#v}"
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          cp "$apk" "release/EV-Calculator-PRO-${artifact_version}.apk"
          cp "$aab" "release/EV-Calculator-PRO-${artifact_version}.aab"

      - name: Publish APK and AAB as GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-v${VERSION#v}-${GITHUB_RUN_NUMBER}"
          apk="release/EV-Calculator-PRO-v${VERSION#v}.apk"
          aab="release/EV-Calculator-PRO-v${VERSION#v}.aab"

          if ! gh release create "$tag" \
            "$apk" \
            "$aab" \
            --title "EV Calculator PRO v${VERSION#v} build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated release build from main. Commit: ${GITHUB_SHA}" \
            --target "$GITHUB_SHA"; then
            echo "Release command returned an error; checking whether the release and both assets were actually created."
            if gh release view "$tag" >/dev/null 2>&1 && \
               gh release view "$tag" --json assets --jq '.assets | map(.name) | index("EV-Calculator-PRO-v'"${VERSION#v}"'.apk")' | grep -q '^[0-9]\+$' && \
               gh release view "$tag" --json assets --jq '.assets | map(.name) | index("EV-Calculator-PRO-v'"${VERSION#v}"'.aab")' | grep -q '^[0-9]\+$'; then
              echo "Release $tag exists with APK and AAB. Treating the publish step as successful."
            else
              echo "Release publication did not complete successfully."
              exit 1
            fi
          fi
