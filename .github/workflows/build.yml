name: Build EV Calculator PRO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EV_CALCULATOR_KEYSTORE_BASE64: ${{ secrets.EV_CALCULATOR_KEYSTORE_BASE64 }}
      EV_CALCULATOR_KEYSTORE_PASSWORD: ${{ secrets.EV_CALCULATOR_KEYSTORE_PASSWORD }}
      EV_CALCULATOR_KEY_ALIAS: ${{ secrets.EV_CALCULATOR_KEY_ALIAS }}
      EV_CALCULATOR_KEY_PASSWORD: ${{ secrets.EV_CALCULATOR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepare single ordered car catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_catalog.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'    private void loadVehicles\(\) \{.*?\n    \}\n\n    private void loadAssetVehicles', re.S)
          replacement = '''    private void loadVehicles() {
        vehicles.clear();
        try (InputStream in = getAssets().open("catalog_es_2024_2026.json");
             BufferedReader r = new BufferedReader(new InputStreamReader(in))) {
            StringBuilder sb = new StringBuilder();
            String line;
            while ((line = r.readLine()) != null) {
                sb.append(line);
            }
            JSONArray a = new JSONObject(sb.toString()).optJSONArray("vehicles");
            if (a == null) {
                throw new IllegalStateException("catalog_es_2024_2026.json: vehicles array missing");
            }
            for (int i = 0; i < a.length(); i++) {
                JSONObject o = a.optJSONObject(i);
                if (o != null) {
                    vehicles.add(new Vehicle(o));
                }
            }
        } catch (Exception e) {
            throw new IllegalStateException("No se ha podido cargar el catálogo español", e);
        }
        if (vehicles.isEmpty()) {
            throw new IllegalStateException("El catálogo español está vacío");
        }
    }

    private void loadAssetVehicles'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('No se encontró el método loadVehicles esperado')
          path.write_text(updated, encoding='utf-8')
          print('CompararCochesActivity now reads only catalog_es_2024_2026.json')
          PY

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EV_CALCULATOR_KEYSTORE_BASE64:-}" || { echo "ERROR: EV_CALCULATOR_KEYSTORE_BASE64 is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEYSTORE_PASSWORD:-}" || { echo "ERROR: EV_CALCULATOR_KEYSTORE_PASSWORD is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEY_ALIAS:-}" || { echo "ERROR: EV_CALCULATOR_KEY_ALIAS is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEY_PASSWORD:-}" || { echo "ERROR: EV_CALCULATOR_KEY_PASSWORD is not configured."; exit 1; }
          echo "$EV_CALCULATOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/evcalculator-upload.jks"
          test -s "$RUNNER_TEMP/evcalculator-upload.jks"
          echo "Release upload keystore configured."

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*$/\1/p" app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not determine versionName from app/build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App version: $version"

      - name: Build Release APK and AAB
        env:
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/evcalculator-upload.jks
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          test -n "$apk" || { echo "No Release APK found."; exit 1; }
          test -n "$aab" || { echo "No Release AAB found."; exit 1; }
          echo "Release APK: $apk"
          echo "Release AAB: $aab"

      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          artifact_version="v${VERSION#v}"
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          cp "$apk" "release/EV-Calculator-PRO-${artifact_version}.apk"
          cp "$aab" "release/EV-Calculator-PRO-${artifact_version}.aab"
          zip -r "release/EV-Calculator-PRO-${artifact_version}.zip" . -x '.git/*' '.gradle/*' 'app/build/*' 'release/*'

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}-apk
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}-aab
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.aab
          if-no-files-found: error

      - name: Upload project ZIP
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}-source
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Commit catalog and source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/catalog_es_2024_2026.json app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          if git diff --cached --quiet; then
            echo "Catalog and source already up to date."
            exit 0
          fi
          git commit -m "chore: update ordered car catalog"
          git push

# Trigger release build after Spanish catalog integration.
