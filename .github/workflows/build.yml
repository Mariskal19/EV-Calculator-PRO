name: Build EV Calculator PRO

# Clean build verification trigger
on:
  workflow_dispatch:
  push:
    branches: [ main, feature/comparar-coches-1.0.4, feature/automatizacion-coches ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EV_CALCULATOR_KEYSTORE_BASE64: ${{ secrets.EV_CALCULATOR_KEYSTORE_BASE64 }}
      EV_CALCULATOR_KEYSTORE_PASSWORD: ${{ secrets.EV_CALCULATOR_KEYSTORE_PASSWORD }}
      EV_CALCULATOR_KEY_ALIAS: ${{ secrets.EV_CALCULATOR_KEY_ALIAS }}
      EV_CALCULATOR_KEY_PASSWORD: ${{ secrets.EV_CALCULATOR_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Restore compare summary and comment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text(encoding='utf-8')
          new_build='''    private void buildSummary(){
        LinearLayout card=new LinearLayout(this);card.setOrientation(LinearLayout.VERTICAL);card.setPadding(dp(16),dp(14),dp(16),dp(14));card.setBackground(strokeBg(dark?Color.rgb(17,31,44):Color.WHITE,dark?Color.rgb(43,64,82):Color.rgb(218,228,239),18));
        TextView h=tv("Resumen de la comparativa",18,text());h.setTypeface(null,Typeface.BOLD);card.addView(h,new LinearLayout.LayoutParams(-1,dp(30)));
        TextView intro=tv("Resultado rápido de los vehículos seleccionados",13,sub());card.addView(intro,new LinearLayout.LayoutParams(-1,dp(28)));
        addSummaryWinner(card,"Autonomía","range",true);addSummaryWinner(card,"Consumo","cons",false);addSummaryWinner(card,"Potencia","power",true);addSummaryWinner(card,"Carga DC","dc",true);addSummaryWinner(card,"Precio","price",false);
        TextView selected=tv("Vehículos comparados",14,blue);selected.setTypeface(null,Typeface.BOLD);card.addView(selected,new LinearLayout.LayoutParams(-1,dp(28)));
        for(String id:selectedIds){Vehicle v=find(id);if(v==null)continue;TextView item=tv("•  "+v.make+" "+v.model+" · "+v.version+"  ·  "+marketLabel(v.market),13,text());item.setPadding(0,dp(3),0,dp(3));card.addView(item,new LinearLayout.LayoutParams(-1,-2));}
        TextView commentTitle=tv("Comentario",14,blue);commentTitle.setTypeface(null,Typeface.BOLD);commentTitle.setPadding(0,dp(14),0,dp(4));card.addView(commentTitle,new LinearLayout.LayoutParams(-1,dp(30)));
        TextView comment=tv(summaryComment(),13,sub());comment.setLineSpacing(0,1.15f);comment.setPadding(0,dp(2),0,dp(2));card.addView(comment,new LinearLayout.LayoutParams(-1,-2));
        summary.addView(card,new LinearLayout.LayoutParams(-1,-2));
    }
'''
          s,n=re.subn(r'    private void buildSummary\(\)\{.*?\n    private void addSummaryWinner',new_build+'    private void addSummaryWinner',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('buildSummary block not found')
          helpers='''    private String summaryComment(){
        List<Vehicle> chosen=new ArrayList<>();
        for(String id:selectedIds){Vehicle v=find(id);if(v!=null)chosen.add(v);}
        if(chosen.size()<2)return"";
        Vehicle bestRange=bestVehicle("range",true),bestCons=bestVehicle("cons",false),bestPrice=bestVehicle("price",false);
        StringBuilder out=new StringBuilder();out.append("En conjunto, ");
        if(bestRange!=null)out.append(bestRange.make).append(" ").append(bestRange.model).append(" destaca por autonomía");
        if(bestCons!=null&&bestCons!=bestRange)out.append(", mientras que ").append(bestCons.make).append(" ").append(bestCons.model).append(" ofrece el menor consumo");
        if(bestPrice!=null&&bestPrice!=bestRange&&bestPrice!=bestCons)out.append(" y ").append(bestPrice.make).append(" ").append(bestPrice.model).append(" es la opción más económica");
        out.append(". La elección final dependerá de si priorizas autonomía, eficiencia, prestaciones, velocidad de carga o precio.");
        return out.toString();
    }
    private Vehicle bestVehicle(String key,boolean higherBetter){
        Vehicle bestV=null;double best=Double.NaN;
        for(String id:selectedIds){Vehicle v=find(id);if(v==null)continue;double n=numeric(v,key);if(Double.isNaN(n))continue;if(Double.isNaN(best)||(higherBetter?n>best:n<best)){best=n;bestV=v;}}
        return bestV;
    }
'''
          marker='    private String empty(String s){'
          if marker not in s: raise SystemExit('empty marker not found')
          if 'private String summaryComment()' not in s: s=s.replace(marker,helpers+marker,1)
          p.write_text(s,encoding='utf-8')
          print('summary/comment restored')
          PY
      - name: Commit restored compare code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          if ! git diff --cached --quiet; then git commit -m 'restore compare summary and comment'; git push; fi
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EV_CALCULATOR_KEYSTORE_BASE64:-}" || { echo "ERROR: EV_CALCULATOR_KEYSTORE_BASE64 is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEYSTORE_PASSWORD:-}" || { echo "ERROR: EV_CALCULATOR_KEYSTORE_PASSWORD is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEY_ALIAS:-}" || { echo "ERROR: EV_CALCULATOR_KEY_ALIAS is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEY_PASSWORD:-}" || { echo "ERROR: EV_CALCULATOR_KEY_PASSWORD is not configured."; exit 1; }
          echo "$EV_CALCULATOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/evcalculator-upload.jks"
          test -s "$RUNNER_TEMP/evcalculator-upload.jks"
          echo "Release upload keystore configured."
      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+[\'\"]([^\'\"]+)[\'\"].*$/\1/p" app/build.gradle | head -n 1)
          if [ -z "$version" ]; then echo "Could not determine versionName from app/build.gradle"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App version: $version"
      - name: Build Release APK and AAB
        env:
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/evcalculator-upload.jks
        run: gradle --no-daemon clean assembleRelease bundleRelease
      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          test -n "$apk" || { echo "No Release APK found."; exit 1; }
          test -n "$aab" || { echo "No Release AAB found."; exit 1; }
          echo "Release APK: $apk"
          echo "Release AAB: $aab"
      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          artifact_version="v${VERSION#v}"
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          cp "$apk" "release/EV-Calculator-PRO-${artifact_version}.apk"
          cp "$aab" "release/EV-Calculator-PRO-${artifact_version}.aab"
          zip -r "release/EV-Calculator-PRO-${artifact_version}.zip" . -x '.git/*' '.gradle/*' 'app/build/*' 'release/*'
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
      - name: Upload release AAB
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}-aab
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.aab
          if-no-files-found: error
      - name: Upload project ZIP
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}-source
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

# Trigger clean verification on corrected main
