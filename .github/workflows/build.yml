name: Build EV Calculator PRO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EV_CALCULATOR_KEYSTORE_BASE64: ${{ secrets.EV_CALCULATOR_KEYSTORE_BASE64 }}
      EV_CALCULATOR_KEYSTORE_PASSWORD: ${{ secrets.EV_CALCULATOR_KEYSTORE_PASSWORD }}
      EV_CALCULATOR_KEY_ALIAS: ${{ secrets.EV_CALCULATOR_KEY_ALIAS }}
      EV_CALCULATOR_KEY_PASSWORD: ${{ secrets.EV_CALCULATOR_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply verified Spanish market arrival years
        shell: python
        run: |
          import json, re, unicodedata
          from pathlib import Path

          inv = json.loads(Path('app/src/main/assets/vehicle_inventory.json').read_text(encoding='utf-8'))
          path = Path('app/src/main/assets/vehicle_variants.json')
          raw = path.read_text(encoding='utf-8').lstrip('\ufeff \t\r\n')
          data, end = json.JSONDecoder().raw_decode(raw)
          trailing = raw[end:].strip()
          if trailing:
              print(f'Ignoring {len(trailing)} trailing characters after the first JSON document; repairing catalog.')

          def norm(v):
              v = '' if v is None else str(v)
              v = unicodedata.normalize('NFKD', v)
              v = ''.join(c for c in v if not unicodedata.combining(c))
              v = v.lower().replace('–','-').replace('—','-')
              return re.sub(r'\s+', ' ', v).strip()

          lookup = {}
          for brand in inv.get('inventory', []):
              make = norm(brand.get('make'))
              for model in brand.get('models', []):
                  arrival = model.get('arrivalYear')
                  for version in model.get('versions', []):
                      lookup[(make, norm(model.get('model')), norm(version))] = arrival

          unmatched = []
          matched = 0
          for v in data.get('vehicles', []):
              market = norm(v.get('market', v.get('mercado', 'ES'))).upper()
              if market != 'ES':
                  continue
              key = (norm(v.get('make', v.get('brand', ''))), norm(v.get('model', '')), norm(v.get('version', v.get('trim', ''))))
              arrival = lookup.get(key)
              if arrival is None:
                  # No verified arrival year: never expose the old model/technical year as arrival year.
                  v['year'] = 0
                  v['arrivalYear'] = None
                  unmatched.append(key)
              else:
                  v['year'] = int(arrival)
                  v['arrivalYear'] = int(arrival)
                  matched += 1

          print(f'Matched Spanish variants: {matched}')
          print(f'Spanish variants without a verified arrival year: {len(unmatched)}')
          for item in unmatched:
              print('NO VERIFIED YEAR:', item)

          data['datasetVersion'] = '2.1.0'
          data['arrivalYearSource'] = 'vehicle_inventory.json'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Commit arrival-year migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/vehicle_variants.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat: use verified Spanish market arrival years'
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EV_CALCULATOR_KEYSTORE_BASE64:-}" || { echo "ERROR: EV_CALCULATOR_KEYSTORE_BASE64 is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEYSTORE_PASSWORD:-}" || { echo "ERROR: EV_CALCULATOR_KEYSTORE_PASSWORD is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEY_ALIAS:-}" || { echo "ERROR: EV_CALCULATOR_KEY_ALIAS is not configured."; exit 1; }
          test -n "${EV_CALCULATOR_KEY_PASSWORD:-}" || { echo "ERROR: EV_CALCULATOR_KEY_PASSWORD is not configured."; exit 1; }
          echo "$EV_CALCULATOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/evcalculator-upload.jks"
          test -s "$RUNNER_TEMP/evcalculator-upload.jks"
          echo "Release upload keystore configured."

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*$/\1/p" app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "Could not determine versionName from app/build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App version: $version"

      - name: Build Release APK and AAB
        env:
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/evcalculator-upload.jks
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          test -n "$apk" || { echo "No Release APK found."; exit 1; }
          test -n "$aab" || { echo "No Release AAB found."; exit 1; }
          echo "Release APK: $apk"
          echo "Release AAB: $aab"

      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          artifact_version="v${VERSION#v}"
          apk=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*debug*" | head -n 1)
          aab=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)
          cp "$apk" "release/EV-Calculator-PRO-${artifact_version}.apk"
          cp "$aab" "release/EV-Calculator-PRO-${artifact_version}.aab"
          zip -r "release/EV-Calculator-PRO-${artifact_version}.zip" . -x '.git/*' '.gradle/*' 'app/build/*' 'release/*'

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}-apk
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}-aab
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.aab
          if-no-files-found: error

      - name: Upload project ZIP
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-v${{ steps.version.outputs.version }}-source
          path: release/EV-Calculator-PRO-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
