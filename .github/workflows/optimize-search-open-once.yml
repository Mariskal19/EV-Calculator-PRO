name: One-time search opening optimization

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-search-open-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch search opening safely
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = path.read_text(encoding='utf-8')
          original = s

          # Do not rebuild the entire comparison screen when returning from search.
          s, n = re.subn(
              r'if \(!vehicles\.isEmpty\(\)\) \{\s*build\(\);\s*loadSelection\(\);\s*rebuild\(\);\s*\}',
              'if (!vehicles.isEmpty()) {\n            loadSelection();\n            rebuild();\n        }',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit(f'onResume block patch expected 1 match, got {n}')

          # Ensure the first search result render is posted after the dialog can draw.
          start = s.find('private void showSearch(')
          if start < 0:
              raise SystemExit('showSearch() not found')
          end = s.find('\n    private ', start + 10)
          if end < 0:
              end = len(s)
          block = s[start:end]

          call = re.search(r'(?<![\w.])renderSearchResults\(\s*input\s*,\s*list\s*\)\s*;', block)
          if not call:
              raise SystemExit('No initial renderSearchResults call found inside showSearch()')
          before = block[max(0, call.start()-80):call.start()]
          if 'input.post' not in before:
              replacement = 'input.post(() -> renderSearchResults(input,list));'
              block = block[:call.start()] + replacement + block[call.end():]
              s = s[:start] + block + s[end:]

          if s == original:
              raise SystemExit('No source changes were necessary')
          path.write_text(s, encoding='utf-8')
          print('Search opening optimization applied successfully')
          PY

      - name: Commit source and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'Open search dialog before rendering results'
          git rm .github/workflows/optimize-search-open-once.yml .github/workflows/optimize-search-render-once.yml
          git commit -m 'Remove temporary search optimization workflows'
          git push origin main
