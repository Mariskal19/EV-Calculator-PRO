name: One-time dimensions audit
# Triggered once by this update.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-dimensions-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit and fill vehicle dimensions
        env:
          TZ: Europe/Madrid
        run: |
          python -m pip install --disable-pip-version-check pyyaml beautifulsoup4
          python <<'PY'
          import csv, json, re, subprocess, unicodedata
          from datetime import datetime
          from pathlib import Path
          import yaml

          CATALOG = Path("app/src/main/assets/catalog_es_2024_2026.json")
          GAIA = Path("/tmp/evdb")
          FALLBACK = Path("/tmp/ev.csv")

          def norm(s):
              s = unicodedata.normalize("NFD", str(s or "")).encode("ascii","ignore").decode()
              return re.sub(r"[^a-z0-9]+", "", s.lower())

          def slug(s):
              s = unicodedata.normalize("NFD", str(s or "")).encode("ascii","ignore").decode().lower()
              return re.sub(r"[^a-z0-9]+", "-", s).strip("-")

          def load_yaml(path):
              try:
                  with path.open(encoding="utf-8") as f:
                      return yaml.safe_load(f) or {}
              except Exception:
                  return {}

          def dimensions_from_obj(o):
              if not isinstance(o, dict):
                  return None
              d = o.get("dimensions")
              if isinstance(d, dict):
                  try:
                      vals = (d.get("length_mm"), d.get("width_mm"), d.get("height_mm"))
                      if all(v not in (None, "") for v in vals):
                          return {"length": int(float(vals[0])), "width": int(float(vals[1])), "height": int(float(vals[2]))}
                  except Exception:
                      pass
              return None

          subprocess.run(["git","clone","--depth","1","https://github.com/gaia-charge/evdb.git",str(GAIA)],check=True,stdout=subprocess.DEVNULL)
          subprocess.run(["curl","-L","--fail","-o",str(FALLBACK),"https://raw.githubusercontent.com/manisharya490/Electric-Vehicle-Recommendation-System/main/ev.csv"],check=True)

          with CATALOG.open(encoding="utf-8") as f:
              catalog = json.load(f)

          # Gaia model-level dimensions: current structured source, preferred.
          gaia = {}
          gaia_slug = {}
          for p in (GAIA/"data/vehicle-models").glob("*.yaml"):
              o = load_yaml(p)
              d = dimensions_from_obj(o)
              if not d:
                  continue
              make = ((o.get("make") or {}).get("name") if isinstance(o.get("make"),dict) else o.get("make")) or ""
              model = ((o.get("model") or {}).get("name") if isinstance(o.get("model"),dict) else o.get("model")) or ""
              if make and model:
                  gaia[(norm(make), norm(model))] = d

          # Gaia variants as a second source when the model file is absent.
          for p in (GAIA/"data/vehicle-variants").glob("*.yaml"):
              o = load_yaml(p)
              d = dimensions_from_obj(o)
              if not d:
                  continue
              mid = str(o.get("model_id") or "")
              if mid:
                  gaia.setdefault(("__model_id__", norm(mid)), d)

          make_alias = {"alfaromeo":"alfa","skoda":"skoda","cupra":"cupra","mg":"mg","mercedesbenz":"mercedesbenz","smart":"smart","citroen":"citroen","peugeot":"peugeot","volkswagen":"volkswagen"}
          def makekey(s):
              n=norm(s)
              return make_alias.get(n,n)

          fallback = {}
          with FALLBACK.open(encoding="utf-8", newline="") as f:
              for r in csv.DictReader(f):
                  try:
                      d={"length":int(float(r["length_mm"])),"width":int(float(r["width_mm"])),"height":int(float(r["height_mm"]))}
                  except Exception:
                      continue
                  fallback.setdefault((makekey(r.get("brand")),norm(r.get("model"))),d)

          import urllib.request, time
          import sqlite3
          import subprocess

          vehicle_db = {}
          try:
              subprocess.run(["curl","-L","--fail","--silent","--show-error","-o","/tmp/vehicles.sqlite","https://raw.githubusercontent.com/gor3a/vehicle-makes-models/main/data/vehicles.sqlite"],check=True)
              conn=sqlite3.connect("/tmp/vehicles.sqlite")
              cur=conn.cursor()
              tables=[r[0] for r in cur.execute("SELECT name FROM sqlite_master WHERE type='table'")]
              for table in tables:
                  cols=[r[1] for r in cur.execute("PRAGMA table_info('"+table+"')")]
                  req={"make","model","length_mm","width_mm","height_mm"}
                  if not req.issubset(set(cols)): continue
                  q='SELECT make,model,length_mm,width_mm,height_mm FROM "'+table+'" WHERE length_mm IS NOT NULL AND width_mm IS NOT NULL AND height_mm IS NOT NULL'
                  for row in cur.execute(q):
                      try:
                          mk0=norm(row[0]) if row[0] else ""\n                          mk={"alfaromeo":"alfa","mercedesbenz":"mercedesbenz","citroen":"citroen","skoda":"skoda"}.get(mk0,mk0)
                          md=norm(row[1])
                          d={"length":int(float(row[2])),"width":int(float(row[3])),"height":int(float(row[4]))}
                          if mk and md: vehicle_db.setdefault((mk,md),d)
                      except Exception:
                          pass
              conn.close()
          except Exception:
              vehicle_db={}

          from bs4 import BeautifulSoup

          auto_dim = {}
          brand_json_dim = {}

          def load_brand_json(make):
              candidates=[slug(make)]
              if makekey(make)=="changan" and "deepal" not in candidates: candidates.append("deepal")
              if makekey(make)=="mercedesbenz": candidates.append("mercedes-benz")
              if makekey(make)=="alfaromeo": candidates.append("alfa-romeo")
              if makekey(make)=="skoda": candidates.append("skoda")
              for bs in candidates:
                  raw=fetch_text(f"https://raw.githubusercontent.com/gor3a/vehicle-makes-models/main/data/json/{bs}.json")
                  if not raw: continue
                  try:
                      data=json.loads(raw)
                  except Exception:
                      continue
                  for mkobj in data.get("makes",[]):
                      actual_make=mkobj.get("name","")
                      for model in mkobj.get("models",[]):
                          model_name=model.get("name","")
                          best=None; best_year=-1
                          for gen in model.get("generations",[]):
                              gy=gen.get("yearStart") or 0
                              for eng in gen.get("engines",[]):
                                  vals=(eng.get("lengthMm"),eng.get("widthMm"),eng.get("heightMm"))
                                  if all(v not in (None,"") for v in vals) and gy>=best_year:
                                      best={"length":int(float(vals[0])),"width":int(float(vals[1])),"height":int(float(vals[2]))}
                                      best_year=gy
                          if best and model_name:
                              brand_json_dim[(makekey(actual_make),norm(model_name))]=best
                  break

          needed_makes=sorted(set(v.get("make","") for v in catalog.get("vehicles",[])))
          for make in needed_makes:
              load_brand_json(make)

          carsguide_dim = {}

          def fetch_text(url):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 EV-Calculator-PRO dimensions audit"})
                  with urllib.request.urlopen(req,timeout=12) as resp:
                      return resp.read().decode("utf-8","ignore")
              except Exception:
                  return ""

          def parse_auto_model(html):
              if not html: return None
              text=BeautifulSoup(html,"html.parser").get_text(" ",strip=True)
              m=re.search(r"has a length of\s*(\d+)\s*mm,\s*a height of\s*(\d+)\s*mm,\s*a width of\s*(\d+)\s*mm",text,re.I)
              if m: return {"length":int(m.group(1)),"width":int(m.group(3)),"height":int(m.group(2))}
              m=re.search(r"L x W x H:\s*(\d+)\s*x\s*(\d+)\s*x\s*(\d+)\s*mm",text,re.I)
              if m: return {"length":int(m.group(1)),"width":int(m.group(2)),"height":int(m.group(3))}
              return None

          def parse_carsguide(html):
              if not html: return None
              text=BeautifulSoup(html,"html.parser").get_text(" ",strip=True)
              m=re.search(r"Height from\s*(\d+)\s*mm.*?Width from\s*(\d+)\s*mm.*?Length from\s*(\d+)\s*mm",text,re.I)
              if m: return {"length":int(m.group(3)),"width":int(m.group(2)),"height":int(m.group(1))}
              m=re.search(r"Height x Width x Length:\s*(\d+)\s*x\s*(\d+)\s*x\s*(\d+)\s*mm",text,re.I)
              if m: return {"length":int(m.group(3)),"width":int(m.group(2)),"height":int(m.group(1))}
              return None

          catalog_models=[(v.get("make",""),v.get("model","")) for v in catalog.get("vehicles",[])]
          seen=set()
          for make,model in catalog_models:
              k=(makekey(make) if "makekey" in globals() else norm(make), norm(model))
              if k in seen: continue
              seen.add(k)
              if k in gaia or k in fallback or k in vehicle_db or k in brand_json_dim or (slug(make)+"-"+slug(model)) in gaia_slug:
                  continue
              ms=slug(make)
              ds0=slug(model)
              ds_candidates=[ds0]
              cleaned=re.sub(r"(?i)(eléctrico|electric|e-tech|e tech|ev|suv|bev|shs)","",model)
              ds_clean=slug(cleaned)
              if ds_clean and ds_clean not in ds_candidates: ds_candidates.append(ds_clean)
              special={"clase-g":"g-class","explorer-electrico":"explorer","kona-electrico":"kona","frontera-electric":"frontera","grandland-electric":"grandland","e-c5-aircross":"c5-aircross","ë-c5-aircross":"c5-aircross","renault-4-e-tech-electrico":"4-e-tech","renault-5-e-tech":"5-e-tech"}
              if ds0 in special and special[ds0] not in ds_candidates: ds_candidates.append(special[ds0])
              for ds in ds_candidates[:3]:
                  h=fetch_text(f"https://www.automobiledimension.com/model/{ms}/{ds}")
                  d=parse_auto_model(h)
                  if d:
                      auto_dim[k]=d; break
              if k not in auto_dim:
                  for ds in ds_candidates[:3]:
                      for y in (2026,2025,2024):
                          h=fetch_text(f"https://www.carsguide.com.au/{ms}/{ds}/car-dimensions/{y}")
                          d=parse_carsguide(h)
                          if d:
                              carsguide_dim[k]=d; break
                      if k in carsguide_dim: break
              time.sleep(0.03)
          model_alias = {
              "q6suvetron":"q6etron",
              "sq6suvetron":"sq6etron",
              "atto3evo":"atto3",
              "dolphinsurf":"dolphinsurf",
              "ionq5":"ioniq5"
          }
          def modelkey(s):
              n=norm(s)
              return model_alias.get(n,n)

          def find_dims(v):
              mk=makekey(v.get("make"))
              md=modelkey(v.get("model"))
              key=(mk,md)
              if key in gaia:
                  return gaia[key], "Gaia EVDB"
              exact_slug=slug(v.get("make"))+"-"+slug(v.get("model"))
              if exact_slug in gaia_slug:
                  return gaia_slug[exact_slug], "Gaia EVDB (slug match)"
              if key in fallback:
                  return fallback[key], "EV Database dataset 2025"
              if key in vehicle_db:
                  return vehicle_db[key], "Vehicle Makes & Models dataset"
              if key in brand_json_dim:
                  return brand_json_dim[key], "Vehicle Makes & Models JSON dataset"
              if key in auto_dim:
                  return auto_dim[key], "AutomobileDimension.com"
              if key in carsguide_dim:
                  return carsguide_dim[key], "CarsGuide"
              # Controlled model-name variants: same make and one model name contains the other.
              gmatches=[]
              for (gmk,gmd),d in gaia.items():
                  if makekey(gmk)!=mk: continue
                  gm=modelkey(gmd)
                  if md and (md in gm or gm in md):
                      gmatches.append((abs(len(gm)-len(md)),d))
              if gmatches:
                  gmatches.sort(key=lambda x:x[0])
                  return gmatches[0][1], "Gaia EVDB (model variant match)"
              fmatches=[]
              for (fmk,fmd),d in fallback.items():
                  if makekey(fmk)!=mk: continue
                  fm=modelkey(fmd)
                  if md and (md in fm or fm in md):
                      fmatches.append((abs(len(fm)-len(md)),d))
              if fmatches:
                  fmatches.sort(key=lambda x:x[0])
                  return fmatches[0][1], "EV Database dataset 2025 (model variant match)"
              return None, None

          audit = datetime.now().astimezone().isoformat(timespec="seconds")
          found = 0
          missing = []
          sources = {}
          for v in catalog.get("vehicles", []):
              d, source = find_dims(v)
              if d:
                  v["lengthMm"] = d["length"]
                  v["widthMm"] = d["width"]
                  v["heightMm"] = d["height"]
                  v["dimensionsAuditDateTime"] = audit
                  v["dimensionsSource"] = source
                  found += 1
                  sources[source] = sources.get(source,0)+1
              else:
                  missing.append(f'{v.get("make","")} | {v.get("model","")} | {v.get("version","")}')

          if missing:
              unique_missing=sorted(set(missing))
              print("MISSING_DIMENSIONS_START")
              print("\n".join(unique_missing))
              print("MISSING_DIMENSIONS_END")
              Path("/tmp/dimensions_missing.txt").write_text("\n".join(unique_missing),encoding="utf-8")
              raise SystemExit(f"Dimensions missing for {len(missing)} records; catalog was not committed.")

          catalog["dimensionsAudit"] = {
              "auditDateTime": audit,
              "recordsAudited": len(catalog.get("vehicles",[])),
              "recordsFilled": found,
              "sources": sources
          }
          with CATALOG.open("w",encoding="utf-8") as f:
              json.dump(catalog,f,ensure_ascii=False,indent=2)
              f.write("\n")

          print(json.dumps(catalog["dimensionsAudit"],ensure_ascii=False))
          PY

      - name: Commit audited catalog and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/catalog_es_2024_2026.json
          git rm .github/workflows/audit-dimensions-once.yml
          git commit -m "Audit and fill vehicle dimensions"
          git push
