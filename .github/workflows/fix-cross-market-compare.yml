name: Fix cross-market compare
on:
  workflow_dispatch:
  push:
    paths:
      - FIX_CROSS_MARKET_COMPARE.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/automatizacion-coches
          fetch-depth: 0
      - name: Patch comparison selection logic
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text()
          old=s
          s=s.replace('v!=null&&v.market.equalsIgnoreCase(selectedMarket)&&!selectedIds.contains(id)', 'v!=null&&!selectedIds.contains(id)')
          s=s.replace('v!=null&&v.market.equalsIgnoreCase(selectedMarket)){LinearLayout.LayoutParams', 'v!=null){LinearLayout.LayoutParams')
          s=s.replace('if(v!=null&&v.market.equalsIgnoreCase(selectedMarket)&&!selectedIds.contains(id)&&selectedIds.size()<3)', 'if(v!=null&&!selectedIds.contains(id)&&selectedIds.size()<3)')
          s=s.replace('if(v!=null&&v.market.equalsIgnoreCase(selectedMarket)&&!selectedIds.contains(id)&&selectedIds.size()<3)', 'if(v!=null&&!selectedIds.contains(id)&&selectedIds.size()<3)')
          # Changing the search market must not delete cars already selected from another market.
          s=s.replace('selectedIds.clear();saveSelection();rebuild();', 'saveSelection();rebuild();')
          if s==old:
              raise SystemExit('No expected source pattern changed')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'Allow comparing cars from different markets'
          git push origin feature/automatizacion-coches
