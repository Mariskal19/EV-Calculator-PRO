name: Audit vehicle database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [ main, feature/automatizacion-coches ]
    paths:
      - 'app/src/main/assets/vehicles.json'
      - 'scripts/audit_vehicles.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Audit vehicle data
        run: python scripts/audit_vehicles.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vehicle-data-audit
          path: vehicle-audit-report.md
          if-no-files-found: error
