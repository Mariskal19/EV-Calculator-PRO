name: Temporary add Compare translations
on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add Compare translations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/LanguageManager.java')
          s = p.read_text(encoding='utf-8')
          marker = '    add("No disponible", "Not available", "Non disponible", "Nicht verfügbar", "Non disponibile", "Não disponível");\n'
          additions = '''    add("Elige tus vehículos", "Choose your vehicles", "Choisissez vos véhicules", "Wähle deine Fahrzeuge", "Scegli i tuoi veicoli", "Escolha os seus veículos");\n    add("Añade hasta 3 coches para ver sus características y compararlos.", "Add up to 3 cars to see their features and compare them.", "Ajoutez jusqu'à 3 voitures pour voir leurs caractéristiques et les comparer.", "Füge bis zu 3 Fahrzeuge hinzu, um ihre Eigenschaften zu sehen und sie zu vergleichen.", "Aggiungi fino a 3 auto per vederne le caratteristiche e confrontarle.", "Adicione até 3 carros para ver as suas características e compará-los.");\n    add("Características", "Features", "Caractéristiques", "Eigenschaften", "Caratteristiche", "Características");\n    add("Mejor valor", "Best value", "Meilleure valeur", "Bester Wert", "Miglior valore", "Melhor valor");\n    add("Todos los vehículos", "All vehicles", "Tous les véhicules", "Alle Fahrzeuge", "Tutti i veicoli", "Todos os veículos");\n    add("No se encontraron vehículos", "No vehicles found", "Aucun véhicule trouvé", "Keine Fahrzeuge gefunden", "Nessun veicolo trovato", "Nenhum veículo encontrado");\n    add("Resumen de la comparativa", "Comparison summary", "Résumé de la comparaison", "Vergleichszusammenfassung", "Riepilogo del confronto", "Resumo da comparação");\n    add("Resultado rápido de los vehículos seleccionados", "Quick result for the selected vehicles", "Résultat rapide des véhicules sélectionnés", "Schneller Überblick über die ausgewählten Fahrzeuge", "Risultato rapido dei veicoli selezionati", "Resultado rápido dos veículos selecionados");\n    add("Vehículos comparados", "Compared vehicles", "Véhicules comparés", "Verglichene Fahrzeuge", "Veicoli confrontati", "Veículos comparados");\n    add("Comentario", "Comment", "Commentaire", "Kommentar", "Commento", "Comentário");\n    add("Autonomía", "Range", "Autonomie", "Reichweite", "Autonomia", "Autonomia");\n    add("Carga DC", "DC charging", "Recharge DC", "DC-Laden", "Ricarica DC", "Carregamento DC");\n    add("Error al abrir Comparar coches", "Error opening Compare cars", "Erreur lors de l'ouverture de Comparer les voitures", "Fehler beim Öffnen von Autos vergleichen", "Errore nell'apertura di Confronta auto", "Erro ao abrir Comparar carros");\n'''
          if marker not in s:
              raise SystemExit('Translation insertion marker not found')
          if 'add("Elige tus vehículos"' not in s:
              s = s.replace(marker, marker + additions, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/LanguageManager.java
          git commit -m 'fix: translate Compare cars screen labels'
          git push origin HEAD:main
          git rm .github/workflows/tmp_add_compare_translations.yml
          git commit -m 'chore: remove temporary translation workflow'
          git push origin HEAD:main
