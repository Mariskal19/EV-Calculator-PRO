name: One-off result card fix
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch result card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/ElectricVsCombustionActivity.java')
          s=p.read_text()
          old='private TextView resultValue(String s){TextView t=tv(s,22,text());t.setTypeface(null,1);t.setGravity(Gravity.CENTER);t.setIncludeFontPadding(false);return t;}'
          new='private TextView resultValue(String s){TextView t=tv(s,22,text());t.setTypeface(null,1);t.setGravity(Gravity.CENTER);t.setIncludeFontPadding(false);t.setMaxLines(1);t.setAutoSizeTextTypeUniformWithConfiguration(dp(16),dp(22),dp(1),android.util.TypedValue.COMPLEX_UNIT_PX);return t;}'
          if old not in s:
              raise SystemExit('Expected resultValue method not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/ElectricVsCombustionActivity.java
          git commit -m 'fix: prevent large travel results from clipping' || true
          rm .github/workflows/oneoff-result-columns.yml
          git add .github/workflows/oneoff-result-columns.yml
          git commit -m 'chore: remove temporary result card workflow' || true
          git push