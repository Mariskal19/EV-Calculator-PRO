name: Temp - fix search label escape
on:
  push:
    paths:
      - '.github/workflows/tmp_fix_search_label_escape.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix malformed newline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text()
          bad = ')\\n                    .replaceAll("(?i)(?<![0-9])\\\\d+(?:[.,]\\\\d+)?\\\\s*kw\\\\b","")'
          good = ')\n                    .replaceAll("(?i)(?<![0-9])\\\\d+(?:[.,]\\\\d+)?\\\\s*kw\\\\b","")'
          if bad not in s:
              raise SystemExit('Malformed literal newline sequence not found')
          s = s.replace(bad, good, 1)
          p.write_text(s)
          PY
          git diff --check
          grep -q '.replaceAll("(?i)(?<![0-9])\\\\d+(?:[.,]\\\\d+)?\\\\s*kw\\\\b","")' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'fix: correct search label regex formatting' || exit 0
          git push origin main
