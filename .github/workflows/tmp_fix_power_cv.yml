name: TMP Fix power display CV

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp_fix_power_cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Change power display to CV primary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text(encoding='utf-8')
          old='if("power".equals(key))return v.powerKw>0?String.format(Locale.US,"%.0f kW",v.powerKw):"—";'
          new='if("power".equals(key))return v.powerKw>0?Math.round(v.powerKw*1.35962)+" CV ("+String.format(Locale.US,"%.0f kW",v.powerKw)+")":"—";'
          if old not in s:
              raise SystemExit('Target power display expression not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('Power display changed: CV primary, kW secondary')
          PY
      - name: Validate source
        run: |
          grep -o '.\{0,100\}if("power".equals(key)).\{0,180\}' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java | head -3
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'fix: show power in CV as primary unit'
          git push
