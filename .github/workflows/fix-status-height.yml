name: Fix status card height

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix warning card height
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/MainActivity.java')
          s = p.read_text()
          old = 'statusBox.addView(textCol,new LinearLayout.LayoutParams(0,dp(64),1)); statusBox.getLayoutParams().height=dp(84);'
          new = 'statusBox.addView(textCol,new LinearLayout.LayoutParams(0,dp(56),1)); statusBox.getLayoutParams().height=dp(78);'
          if old not in s:
              raise SystemExit('Expected warning-card layout not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/MainActivity.java
          git commit -m 'fix: keep warning departure card height consistent'
          git push