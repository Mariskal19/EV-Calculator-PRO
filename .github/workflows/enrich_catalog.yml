name: Enrich Spanish EV catalog

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/enrich_catalog_missing.py'
      - '.github/workflows/enrich_catalog.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Enrich only missing technical fields
        run: python3 .github/scripts/enrich_catalog_missing.py

      - name: Validate catalog integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('app/src/main/assets/catalog_es_2024_2026.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          vs = d.get('vehicles')
          if not isinstance(vs, list) or len(vs) != 626:
              raise SystemExit(f'Unexpected vehicle count: {len(vs) if isinstance(vs,list) else None}')
          bad_year = [v for v in vs if v.get('year') not in (2024,2025,2026)]
          if bad_year:
              raise SystemExit(f'Invalid year records: {len(bad_year)}')
          bad = [v for v in vs if (v.get('batteryKwh') or 0) > 0 and (v.get('wltpKm') or 0) > 0 and not (v.get('consumptionKwh100') or 0)]
          if bad:
              raise SystemExit(f'Missing consumption records: {len(bad)}')
          print(f'Catalog validation OK: {len(vs)} vehicles')
          PY

      - name: Commit enriched catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- app/src/main/assets/catalog_es_2024_2026.json; then
            echo 'No missing technical fields were found.'
            exit 0
          fi
          git add app/src/main/assets/catalog_es_2024_2026.json
          git commit -m 'catalog: fill missing technical specifications'
          git push origin HEAD:main
