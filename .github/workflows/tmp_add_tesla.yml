# Tesla catalog integration workflow
name: TMP Add Tesla catalog

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp_add_tesla.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-tesla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add Tesla configurations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('app/src/main/assets/catalog_es_2024_2026.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          v=[x for x in d['vehicles'] if x.get('make')!='Tesla']
          T=[
          ('Model 3',2024,'Tracción trasera 208 kW RWD 60 kWh',60,208,'RWD',513,13.2,'LFP'),
          ('Model 3',2024,'Gran autonomía 208 kW AWD 79 kWh',79,208,'AWD',629,14.0,'NMC'),
          ('Model 3',2024,'Gran autonomía 224 kW RWD 79 kWh',79,224,'RWD',702,13.6,'NMC'),
          ('Model 3',2024,'Performance 461 kW AWD 79 kWh',79,461,'AWD',528,16.7,'NMC'),
          ('Model 3',2025,'Tracción trasera 208 kW RWD 60 kWh',60,208,'RWD',554,13.0,'LFP'),
          ('Model 3',2025,'Premium Gran autonomía 235 kW RWD 79 kWh',79,235,'RWD',750,13.6,'NMC'),
          ('Model 3',2025,'Premium Gran autonomía 366 kW AWD 79 kWh',79,366,'AWD',660,14.3,'NMC'),
          ('Model 3',2025,'Performance 461 kW AWD 79 kWh',79,461,'AWD',571,16.5,'NMC'),
          ('Model 3',2026,'Tracción trasera 208 kW RWD 60 kWh',60,208,'RWD',534,13.0,'LFP'),
          ('Model 3',2026,'Premium Gran autonomía 235 kW RWD 79 kWh',79,235,'RWD',750,13.6,'NMC'),
          ('Model 3',2026,'Premium Gran autonomía 366 kW AWD 79 kWh',79,366,'AWD',660,14.3,'NMC'),
          ('Model 3',2026,'Performance 461 kW AWD 79 kWh',79,461,'AWD',571,16.5,'NMC'),
          ('Model Y',2024,'Tracción trasera 220 kW RWD 60 kWh',60,220,'RWD',455,15.7,'LFP'),
          ('Model Y',2024,'Gran autonomía 255 kW RWD 75 kWh',75,255,'RWD',600,15.5,'NMC'),
          ('Model Y',2024,'Gran autonomía 378 kW AWD 75 kWh',75,378,'AWD',533,16.9,'NMC'),
          ('Model Y',2024,'Performance 393 kW AWD 75 kWh',75,393,'AWD',514,17.3,'NMC'),
          ('Model Y',2025,'Launch Series Gran autonomía 378 kW AWD 75 kWh',75,378,'AWD',568,15.3,'NMC'),
          ('Model Y',2025,'Tracción trasera 220 kW RWD 60 kWh',60,220,'RWD',500,13.9,'LFP'),
          ('Model Y',2025,'Gran autonomía 255 kW RWD 75 kWh',75,255,'RWD',622,14.2,'NMC'),
          ('Model Y',2025,'Gran autonomía 378 kW AWD 75 kWh',75,378,'AWD',586,15.3,'NMC'),
          ('Model Y',2025,'Performance 461 kW AWD 75 kWh',75,461,'AWD',580,16.2,'NMC'),
          ('Model Y',2025,'Standard 220 kW RWD 61 kWh',61,220,'RWD',534,13.1,'Li-ion'),
          ('Model Y',2025,'Premium Gran autonomía 220 kW RWD 75 kWh',75,220,'RWD',603,14.0,'NMC'),
          ('Model Y',2025,'Premium Gran autonomía 378 kW AWD 75 kWh',75,378,'AWD',600,15.9,'NMC'),
          ('Model Y',2026,'Tracción trasera 227 kW RWD 61 kWh',61,227,'RWD',534,13.1,'Li-ion'),
          ('Model Y',2026,'Standard Gran autonomía 220 kW RWD 75 kWh',75,220,'RWD',657,12.7,'NMC'),
          ('Model Y',2026,'Premium Gran autonomía 255 kW RWD 75 kWh',75,255,'RWD',603,14.0,'NMC'),
          ('Model Y',2026,'Premium Gran autonomía 378 kW AWD 75 kWh',75,378,'AWD',600,15.9,'NMC'),
          ('Model Y',2026,'Premium Gran autonomía 7 plazas 378 kW AWD 75 kWh',75,378,'AWD',600,15.9,'NMC'),
          ('Model Y',2026,'Performance 461 kW AWD 75 kWh',75,461,'AWD',580,16.2,'NMC')]
          for m,y,ver,b,pow,drive,wltp,c,chem in T:
              x={'make':'Tesla','model':m,'year':y,'arrivalYear':y,'market':'ES','version':ver,'batteryKwh':b,'batteryChemistry':chem,'powerKw':pow,'drive':drive,'wltpKm':wltp,'consumptionKwh100':c}
              v.append(x)
          v.sort(key=lambda x:(x.get('market',''),x.get('make',''),x.get('model',''),x.get('year',0),x.get('version','')))
          d['vehicles']=v
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Tesla:',len(T),'Catalog:',len(v))
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('app/src/main/assets/catalog_es_2024_2026.json'))
          v=d['vehicles']; t=[x for x in v if x.get('make')=='Tesla']
          assert len(t)==30, len(t)
          assert all(x.get('year') in (2024,2025,2026) for x in v)
          assert not any((x.get('batteryKwh') or 0)>0 and (x.get('wltpKm') or 0)>0 and x.get('consumptionKwh100') in (None,'',0) for x in v)
          print('VALID Tesla=30 total=',len(v))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/catalog_es_2024_2026.json
          git commit -m 'feat: add Tesla Spanish catalog entries'
          git push
