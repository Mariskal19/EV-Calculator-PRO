name: migrate-arrival-year

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-arrival-year.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrate Spanish catalog year to market arrival year
        shell: python
        run: |
          import json
          import re
          import unicodedata
          from pathlib import Path

          inventory_path = Path('app/src/main/assets/vehicle_inventory.json')
          variants_path = Path('app/src/main/assets/vehicle_variants.json')

          inv = json.loads(inventory_path.read_text(encoding='utf-8'))
          variants = json.loads(variants_path.read_text(encoding='utf-8'))

          def norm(value):
              value = '' if value is None else str(value)
              value = unicodedata.normalize('NFKD', value)
              value = ''.join(c for c in value if not unicodedata.combining(c))
              value = value.lower().replace('–', '-').replace('—', '-')
              value = re.sub(r'\\s+', ' ', value).strip()
              return value

          lookup = {}
          for brand in inv.get('inventory', []):
              make = norm(brand.get('make'))
              for model in brand.get('models', []):
                  model_name = norm(model.get('model'))
                  arrival = model.get('arrivalYear')
                  for version in model.get('versions', []):
                      lookup[(make, model_name, norm(version))] = arrival

          vehicles = variants.get('vehicles', [])
          matched = 0
          unmatched = []
          for v in vehicles:
              market = norm(v.get('market', v.get('mercado', 'ES'))).upper()
              if market != 'ES':
                  continue
              key = (norm(v.get('make', v.get('brand', ''))), norm(v.get('model', '')), norm(v.get('version', v.get('trim', ''))))
              arrival = lookup.get(key)
              if arrival is None:
                  # Do not expose the old technical/model year as an arrival year.
                  v['year'] = 0
                  unmatched.append(key)
              else:
                  v['year'] = int(arrival)
                  v['arrivalYear'] = int(arrival)
                  matched += 1

          variants['datasetVersion'] = '2.1.0'
          variants['arrivalYearSource'] = 'vehicle_inventory.json'
          variants_path.write_text(json.dumps(variants, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')

          print(f'Matched Spanish variants: {matched}')
          print(f'Unmatched Spanish variants: {len(unmatched)}')
          for item in unmatched:
              print('UNMATCHED:', item)

          if unmatched:
              raise SystemExit('Spanish catalog contains variants without a verified arrival year; refusing to publish stale model years.')

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/vehicle_variants.json
          git diff --cached --quiet || git commit -m 'feat: use verified Spanish market arrival years'
          git push
