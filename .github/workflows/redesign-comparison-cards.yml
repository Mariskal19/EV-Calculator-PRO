name: Apply comparison card redesign

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Redesign comparison cards and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'    private View carCard\(Vehicle v\)\{.*?\n    private void remove\(String id\)', re.S)
          replacement = '''    private View carCard(Vehicle v){
          LinearLayout c=new LinearLayout(this);
          c.setOrientation(LinearLayout.VERTICAL);
          c.setGravity(Gravity.CENTER_HORIZONTAL);
          c.setPadding(dp(10),dp(11),dp(10),dp(8));
          c.setBackground(strokeBg(dark?Color.rgb(18,32,45):Color.WHITE,dark?Color.rgb(49,72,91):Color.rgb(214,225,237),18));

          TextView make=tv(v.make,11,blue);
          make.setTypeface(null,Typeface.BOLD);
          make.setGravity(Gravity.CENTER);
          make.setAllCaps(true);
          make.setLetterSpacing(0.03f);
          c.addView(make,new LinearLayout.LayoutParams(-1,dp(22)));

          TextView model=tv(v.model,17,text());
          model.setTypeface(null,Typeface.BOLD);
          model.setGravity(Gravity.CENTER);
          model.setMaxLines(2);
          c.addView(model,new LinearLayout.LayoutParams(-1,dp(40)));

          LinearLayout meta=new LinearLayout(this);
          meta.setOrientation(LinearLayout.HORIZONTAL);
          meta.setGravity(Gravity.CENTER);
          TextView year=tv(v.year>0?String.valueOf(v.year):"",11,sub());
          year.setGravity(Gravity.CENTER);
          year.setTypeface(null,Typeface.BOLD);
          year.setBackground(strokeBg(dark?Color.rgb(20,38,52):Color.rgb(242,247,253),dark?Color.rgb(48,73,94):Color.rgb(220,229,239),10));
          meta.addView(year,new LinearLayout.LayoutParams(0,dp(26),1));
          TextView market=tv(marketLabel(v.market),10,sub());
          market.setGravity(Gravity.CENTER);
          LinearLayout.LayoutParams marketLp=new LinearLayout.LayoutParams(0,dp(26),1);
          marketLp.setMargins(dp(5),0,0,0);
          meta.addView(market,marketLp);
          c.addView(meta,new LinearLayout.LayoutParams(-1,dp(30)));

          TextView ver=tv(v.version,11,sub());
          ver.setGravity(Gravity.CENTER);
          ver.setMaxLines(2);
          ver.setEllipsize(android.text.TextUtils.TruncateAt.END);
          ver.setPadding(dp(2),dp(2),dp(2),0);
          c.addView(ver,new LinearLayout.LayoutParams(-1,dp(38)));

          LinearLayout specs=new LinearLayout(this);
          specs.setOrientation(LinearLayout.HORIZONTAL);
          specs.setGravity(Gravity.CENTER);
          if(v.batteryKwh>0){
              TextView b=tv(fmt(v.batteryKwh)+" kWh",10,text());
              b.setGravity(Gravity.CENTER);
              b.setBackground(bg(dark?Color.rgb(20,42,58):Color.rgb(238,245,255),10));
              specs.addView(b,new LinearLayout.LayoutParams(0,dp(25),1));
          }
          if(v.wltpKm>0){
              TextView r=tv(String.format(Locale.US,"%.0f km",v.wltpKm),10,text());
              r.setGravity(Gravity.CENTER);
              r.setBackground(bg(dark?Color.rgb(20,42,58):Color.rgb(238,245,255),10));
              LinearLayout.LayoutParams rp=new LinearLayout.LayoutParams(0,dp(25),1);
              rp.setMargins(dp(5),0,0,0);
              specs.addView(r,rp);
          }
          if(specs.getChildCount()>0)c.addView(specs,new LinearLayout.LayoutParams(-1,dp(29)));

          TextView rem=tv("Quitar",11,Color.rgb(210,70,70));
          rem.setGravity(Gravity.CENTER);
          rem.setTypeface(null,Typeface.BOLD);
          rem.setPadding(0,dp(3),0,0);
          rem.setOnClickListener(x->remove(v.id));
          c.addView(rem,new LinearLayout.LayoutParams(-1,dp(27)));
          return c;
      }
      private void remove(String id)'''
          ns, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('carCard method not found')
          p.write_text(ns, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git rm .github/workflows/redesign-comparison-cards.yml
          git commit -m "Redesign comparison vehicle cards"
          git push origin HEAD:main
