name: Catalog final audit

on:
  push:
    paths:
      - '.github/scripts/catalog_finalize.py'
      - '.github/workflows/catalog_finalize.yml'
      - 'app/src/main/assets/catalog_es_2024_2026.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize and audit catalog
        run: python .github/scripts/catalog_finalize.py

      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/catalog_es_2024_2026.json
          if git diff --cached --quiet; then
            echo 'No catalog changes to commit.'
          else
            git commit -m 'catalog: finalize verified vehicle cleanup'
            git push origin main
          fi
