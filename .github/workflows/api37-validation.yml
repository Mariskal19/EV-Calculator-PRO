name: Android API 37 validation

on:
  push:
    branches:
      - dependabot/gradle/androidx.core-core-1.19.1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Install Android API 37 platform
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"

      - name: Validate protected catalog
        run: |
          mkdir -p build/api37-validation
          python3 .github/tests/project_protected_catalog.py app/src/main/assets/catalog_es_2024_2026.json build/api37-validation/catalog.tsv

      - name: Run advisor engine smoke tests
        run: |
          javac -d build/api37-validation app/src/main/java/com/evchargecalculator/AdvisorQueryClassifier.java app/src/main/java/com/evchargecalculator/AdvisorCriteriaEngine.java app/src/main/java/com/evchargecalculator/AdvisorCatalogMatcher.java app/src/main/java/com/evchargecalculator/AdvisorSimilarityIntent.java .github/tests/AdvisorCriteriaEngineSmokeTest.java .github/tests/AdvisorCatalogIntegrationSmokeTest.java
          java -cp build/api37-validation com.evchargecalculator.AdvisorCriteriaEngineSmokeTest
          java -cp build/api37-validation com.evchargecalculator.AdvisorCatalogIntegrationSmokeTest build/api37-validation/catalog.tsv

      - name: Run Android unit tests and build debug APK
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Upload API 37 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: EV-Calculator-PRO-API37-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
