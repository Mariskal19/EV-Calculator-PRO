name: Format Java sources once

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Format Java sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/google-java-format.jar https://github.com/google/google-java-format/releases/download/v1.28.0/google-java-format-1.28.0-all-deps.jar
          find app/src/main/java -type f -name '*.java' ! -name 'CompararCochesActivity.java' -print0 | xargs -0 -r java -jar /tmp/google-java-format.jar --replace
      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java
          if git diff --cached --quiet; then
            echo 'No Java formatting changes needed.'
            exit 0
          fi
          git commit -m 'Format remaining Java sources'
          git push
