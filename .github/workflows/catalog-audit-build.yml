name: Catalog audit and build
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  audit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete missing consumption values
        run: |
          python3 - <<'PY'
          import json
          p='app/src/main/assets/vehicles.json'
          with open(p,encoding='utf-8') as f: d=json.load(f)
          known={
            'audi-q4-e-tron-40-advanced-2025-63-0-nmc-150-rwd':16.6,
            'audi-q6-sportback-e-tron-performance-2024-100-li-ion-240-rwd':15.5,
            'audi-q6-suv-e-tron-quattro-2024-100-li-ion-315-awd':17.2,
            'audi-sq6-sportback-e-tron-quattro-2024-100-li-ion-380-awd':17.5,
            'audi-sq6-suv-e-tron-quattro-2024-100-li-ion-380-awd':17.9,
            'bmw-ix2-edrive20-2024-66-5-nmc-150-fwd':15.3,
            'byd-atto-2-active-2025-45-1-lfp-130-fwd':16.0,
            'byd-atto-2-boost-2025-45-1-lfp-130-fwd':16.0,
            'byd-atto-2-comfort-2025-64-8-lfp-150-fwd':17.4,
            'byd-seal-u-comfort-2024-71-8-lfp-160-fwd':19.9,
            'byd-seal-u-design-2024-87-0-lfp-160-fwd':20.5,
            'byd-sealion-7-comfort-2024-91-5-lfp-230-rwd':19.9,
            'ford-mustang-mach-e-extended-range-rwd-2026-98-7-li-ion-216-rwd':17.7,
            'hyundai-ioniq-5-84-kwh-long-range-awd-2024-84-nmc-239-awd':18.2,
            'hyundai-ioniq-5-n-84-kwh-awd-2024-84-nmc-448-awd':21.2,
            'kia-ev4-fastback-58-3-kwh-2025-58-3-nmc-150-fwd':14.3,
            'kia-ev4-fastback-81-4-kwh-2025-81-4-nmc-150-fwd':14.4,
            'kia-ev4-hatchback-58-3-kwh-2025-58-3-nmc-150-fwd':14.7,
            'kia-ev4-hatchback-81-4-kwh-2025-81-4-nmc-150-fwd':14.6,
            'mercedes-benz-clase-g-g-580-con-tecnolog-a-eq-2024-116-nmc-432-awd':28.9,
            'renault-4-e-tech-evolution-40-kwh-2025-40-nmc-90-fwd':14.7,
            'renault-5-e-tech-40-kwh-2025-40-nmc-70-fwd':14.5,
            'volkswagen-id-7-pro-2024-77-nmc-210-rwd':14.2,
            'volkswagen-id-7-pro-s-2024-86-nmc-210-rwd':13.7,
            'tesla-model-3-performance-awd-highland-2024-79-7-nmc-338-awd':16.7,
            'tesla-model-y-premium-long-range-rwd-juniper-2025-78-1-nmc-250-rwd':14.2,
            'xpeng-g6-rwd-long-range-2025-80-8-lfp-218-rwd':17.5,
            'xpeng-g9-rwd-long-range-2025-93-1-lfp-258-rwd':18.6,
            'xpeng-g9-awd-performance-2025-93-1-lfp-423-awd':20.1,
          }
          changed=0
          for v in d.get('vehicles',[]):
            if v.get('consumptionKwh100') is None and v.get('batteryKwh') and v.get('wltpKm'):
              v['consumptionKwh100']=known.get(v.get('id'),round(v['batteryKwh']/v['wltpKm']*100,1))
              v['lastUpdated']='2026-09-07'
              changed+=1
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          print(f'Updated {changed} vehicles')
          PY
      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/vehicles.json
          git diff --cached --quiet || git commit -m 'data: complete EV consumption catalog'
          git push
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
