name: Temporary catalog ordering update

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-catalog-order:
    if: github.event.head_commit.message != 'chore: apply catalog ordering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update ordering logic
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text(encoding='utf-8')

          old_trim = '''    private int trimRank(Vehicle v) {
        String s = (v.version == null ? "" : v.version).toLowerCase(Locale.ROOT);
        int r = 500;
        if (s.contains("standard") || s.contains("base") || s.contains("pure")
                || s.contains("active") || s.contains("essential")) r = 100;
        if (s.contains("comfort") || s.contains("air") || s.contains("advance")
                || s.contains("evolution")) r = 200;
        if (s.contains("boost") || s.contains("pro") || s.contains("long range")
                || s.contains("earth") || s.contains("techno") || s.contains("design")) r = 300;
        if (s.contains("premium") || s.contains("gt-line") || s.contains("spirit")
                || s.contains("esprit alpine") || s.contains("performance")) r = 400;
        if (s.contains("excellence") || s.contains("gt") || s.contains("awd")) r = 500;
        return r;
    }
'''
          new_trim = '''    /**
     * Generic catalogue hierarchy: base/entry -> intermediate -> extended/Long Range
     * -> AWD/dual motor -> Performance/GT/top sport trims.
     * Technical values are used as tie-breakers so every real configuration remains
     * separate even when two versions share a commercial name.
     */
    private int trimRank(Vehicle v) {
        String s = (v.version == null ? "" : v.version).toLowerCase(Locale.ROOT)
                .replace("-", " ")
                .replace("_", " ");
        int r = 300;
        if (s.contains("standard") || s.contains("base") || s.contains("pure")
                || s.contains("core") || s.contains("essential") || s.contains("life")
                || s.contains("active") || s.contains("entry")) r = 100;
        if (s.contains("comfort") || s.contains("advance") || s.contains("advanced")
                || s.contains("evolution") || s.contains("plus") || s.contains("boost")) r = 200;
        if (s.contains("long range") || s.contains("extended") || s.contains("max")
                || s.contains("pro") || s.contains("premium") || s.contains("design")
                || s.contains("techno") || s.contains("earth")) r = Math.max(r, 300);
        if (s.contains("awd") || s.contains("4wd") || s.contains("dual motor")
                || s.contains("all wheel")) r = Math.max(r, 400);
        if (s.contains("performance") || s.contains("gt") || s.contains("gts")
                || s.contains("rs ") || s.equals("rs") || s.contains("sport")
                || s.contains("m performance") || s.contains("amg")) r = 500;
        return r;
    }
'''
          if old_trim not in s:
              raise SystemExit('trimRank block not found')
          s = s.replace(old_trim, new_trim, 1)

          old_norm = '''        Collections.sort(vehicles, (a, b) -> {
            int c = a.make.compareToIgnoreCase(b.make);
            if (c != 0) return c;
            c = a.model.compareToIgnoreCase(b.model);
            if (c != 0) return c;
            c = Integer.compare(b.year, a.year);
            if (c != 0) return c;
            c = Double.compare(a.batteryKwh, b.batteryKwh);
            if (c != 0) return c;
            return a.version.compareToIgnoreCase(b.version);
        });
'''
          new_norm = '''        // Master catalogue order: MARKET -> BRAND -> MODEL -> PERIOD -> VERSION.
        // The selected market is filtered later by the UI; keeping market first here
        // makes the underlying list deterministic for every market in the catalogue.
        Collections.sort(vehicles, (a, b) -> {
            int c = a.market.compareToIgnoreCase(b.market);
            if (c != 0) return c;
            c = a.make.compareToIgnoreCase(b.make);
            if (c != 0) return c;
            c = a.model.compareToIgnoreCase(b.model);
            if (c != 0) return c;
            c = Integer.compare(a.year, b.year);
            if (c != 0) return c;
            c = Integer.compare(trimRank(a), trimRank(b));
            if (c != 0) return c;
            c = Double.compare(a.batteryKwh, b.batteryKwh);
            if (c != 0) return c;
            c = Double.compare(a.powerKw, b.powerKw);
            if (c != 0) return c;
            c = Integer.compare(a.wltpKm, b.wltpKm);
            if (c != 0) return c;
            return a.version.compareToIgnoreCase(b.version);
        });
'''
          if old_norm not in s:
              raise SystemExit('normalize sort block not found')
          s = s.replace(old_norm, new_norm, 1)

          old_search = '''        Collections.sort(all, (a, b) -> {
            int c = a.make.compareToIgnoreCase(b.make);
            if (c != 0) return c;
            c = a.model.compareToIgnoreCase(b.model);
            if (c != 0) return c;
            c = Integer.compare(a.year, b.year);
            if (c != 0) return c;
            c = Integer.compare(trimRank(a), trimRank(b));
            if (c != 0) return c;
            c = Double.compare(a.price > 0 ? a.price : Double.MAX_VALUE,
                    b.price > 0 ? b.price : Double.MAX_VALUE);
            if (c != 0) return c;
            c = Double.compare(a.batteryKwh, b.batteryKwh);
            if (c != 0) return c;
            return a.version.compareToIgnoreCase(b.version);
        });
'''
          new_search = '''        // Display order follows the catalogue hierarchy exactly:
        // MARKET -> BRAND -> MODEL -> PERIOD -> VERSION/GAMA.
        // Within a model/period, lower trims come first and higher trims later.
        Collections.sort(all, (a, b) -> {
            int c = a.market.compareToIgnoreCase(b.market);
            if (c != 0) return c;
            c = a.make.compareToIgnoreCase(b.make);
            if (c != 0) return c;
            c = a.model.compareToIgnoreCase(b.model);
            if (c != 0) return c;
            c = Integer.compare(a.year, b.year);
            if (c != 0) return c;
            c = Integer.compare(trimRank(a), trimRank(b));
            if (c != 0) return c;
            c = Double.compare(a.batteryKwh, b.batteryKwh);
            if (c != 0) return c;
            c = Double.compare(a.powerKw, b.powerKw);
            if (c != 0) return c;
            c = Integer.compare(a.wltpKm, b.wltpKm);
            if (c != 0) return c;
            c = Double.compare(a.price > 0 ? a.price : Double.MAX_VALUE,
                    b.price > 0 ? b.price : Double.MAX_VALUE);
            if (c != 0) return c;
            return a.version.compareToIgnoreCase(b.version);
        });
'''
          if old_search not in s:
              raise SystemExit('search sort block not found')
          s = s.replace(old_search, new_search, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java .github/workflows/_tmp_catalog_order.yml
          git commit -m "chore: apply catalog ordering"
          git rm .github/workflows/_tmp_catalog_order.yml
          git commit --amend --no-edit
          git push origin HEAD:main
