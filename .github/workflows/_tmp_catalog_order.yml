name: Temporary compare screen optimization

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message != 'chore: apply catalog ordering' && github.event.head_commit.message != 'chore: optimize compare screen startup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Optimize startup and catalogue ordering
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text(encoding='utf-8')

          # Load the catalogue off the UI thread so the activity can render immediately.
          s = s.replace('    private String selectedMarket = "ES";\n', '    private String selectedMarket = "ES";\n    private volatile boolean vehiclesLoaded = false;\n', 1)
          oncreate = '''    @Override
    protected void onCreate(Bundle b) {
        super.onCreate(b);
        try {
            SharedPreferences p = getSharedPreferences(PREFS, MODE_PRIVATE);
            dark = p.contains("dark_theme")
                    ? p.getBoolean("dark_theme", false)
                    : (getResources().getConfiguration().uiMode & 0x30) == 0x20;
            selectedMarket = p.getString(KEY_MARKET, "ES");
            build();

            new Thread(() -> {
                try {
                    CurrencyRateManager.refreshIfNeeded(this);
                    loadVehicles();
                    SharedPreferences prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                    if (!hasMarket(selectedMarket)) selectedMarket = defaultMarket();
                    loadSelection();
                    vehiclesLoaded = true;
                    runOnUiThread(this::rebuild);
                } catch (Throwable t) {
                    runOnUiThread(() -> {
                        TextView e = tv("Error al abrir Comparar coches\\n\\n" + t.getClass().getSimpleName(), 16, Color.WHITE);
                        e.setGravity(Gravity.CENTER);
                        e.setPadding(dp(24), dp(24), dp(24), dp(24));
                        e.setBackgroundColor(Color.rgb(8, 34, 58));
                        setContentView(e);
                    });
                }
            }, "compare-catalog-loader").start();
        } catch (Throwable t) {
            TextView e = tv("Error al abrir Comparar coches\\n\\n" + t.getClass().getSimpleName(), 16, Color.WHITE);
            e.setGravity(Gravity.CENTER);
            e.setPadding(dp(24), dp(24), dp(24), dp(24));
            e.setBackgroundColor(Color.rgb(8, 34, 58));
            setContentView(e);
        }
    }

'''
          s, n = re.subn(r'    @Override\n    protected void onCreate\(Bundle b\) \{.*?\n    \}\n\n    @Override\n    protected void onResume\(\)', oncreate + '    @Override\n    protected void onResume()', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('onCreate replacement failed')

          onresume = '''    @Override
    protected void onResume() {
        super.onResume();
        if (!vehiclesLoaded) return;
        SharedPreferences p = getSharedPreferences(PREFS, MODE_PRIVATE);
        boolean newDark = p.contains("dark_theme")
                ? p.getBoolean("dark_theme", false)
                : (getResources().getConfiguration().uiMode & 0x30) == 0x20;
        if (newDark != dark) {
            dark = newDark;
            build();
            loadSelection();
            rebuild();
        }
    }
'''
          s, n = re.subn(r'    @Override\n    protected void onResume\(\) \{.*?\n    \}\n\n    private int dp', onresume + '\n    private int dp', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('onResume replacement failed')

          # Replace the old trim ranking with the generic catalogue hierarchy.
          new_trim = '''    /**
     * Generic catalogue hierarchy: base/entry -> intermediate -> extended/Long Range
     * -> AWD/dual motor -> Performance/GT/top sport trims.
     */
    private int trimRank(Vehicle v) {
        String s = (v.version == null ? "" : v.version).toLowerCase(Locale.ROOT)
                .replace("-", " ").replace("_", " ");
        int r = 300;
        if (s.contains("standard") || s.contains("base") || s.contains("pure") || s.contains("core")
                || s.contains("essential") || s.contains("life") || s.contains("active") || s.contains("entry")) r = 100;
        if (s.contains("comfort") || s.contains("advance") || s.contains("advanced") || s.contains("evolution")
                || s.contains("plus") || s.contains("boost")) r = 200;
        if (s.contains("long range") || s.contains("extended") || s.contains("max") || s.contains("pro")
                || s.contains("premium") || s.contains("design") || s.contains("techno") || s.contains("earth")) r = Math.max(r, 300);
        if (s.contains("awd") || s.contains("4wd") || s.contains("dual motor") || s.contains("all wheel")) r = Math.max(r, 400);
        if (s.contains("performance") || s.contains("gt") || s.contains("gts") || s.contains("rs ") || s.equals("rs")
                || s.contains("sport") || s.contains("m performance") || s.contains("amg")) r = 500;
        return r;
    }
'''
          s, n = re.subn(r'    private int trimRank\(Vehicle v\) \{.*?\n    \}\n\n    private String searchLabel', new_trim + '\n    private String searchLabel', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('trimRank replacement failed')

          # Keep deterministic master-catalogue ordering.
          sort = '''        Collections.sort(vehicles, (a, b) -> {
            int c = a.market.compareToIgnoreCase(b.market);
            if (c != 0) return c;
            c = a.make.compareToIgnoreCase(b.make);
            if (c != 0) return c;
            c = a.model.compareToIgnoreCase(b.model);
            if (c != 0) return c;
            c = Integer.compare(a.year, b.year);
            if (c != 0) return c;
            c = Integer.compare(trimRank(a), trimRank(b));
            if (c != 0) return c;
            c = Double.compare(a.batteryKwh, b.batteryKwh);
            if (c != 0) return c;
            c = Double.compare(a.powerKw, b.powerKw);
            if (c != 0) return c;
            c = Integer.compare(a.wltpKm, b.wltpKm);
            if (c != 0) return c;
            return a.version.compareToIgnoreCase(b.version);
        });
'''
          s, n = re.subn(r'        Collections.sort\(vehicles, \(a, b\) -> \{.*?\n        \}\);\n', sort, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('catalog sort replacement failed')

          # Search order: market -> brand -> model -> period -> trim -> technical tie-breakers.
          search_sort = '''        Collections.sort(all, (a, b) -> {
            int c = a.market.compareToIgnoreCase(b.market);
            if (c != 0) return c;
            c = a.make.compareToIgnoreCase(b.make);
            if (c != 0) return c;
            c = a.model.compareToIgnoreCase(b.model);
            if (c != 0) return c;
            c = Integer.compare(a.year, b.year);
            if (c != 0) return c;
            c = Integer.compare(trimRank(a), trimRank(b));
            if (c != 0) return c;
            c = Double.compare(a.batteryKwh, b.batteryKwh);
            if (c != 0) return c;
            c = Double.compare(a.powerKw, b.powerKw);
            if (c != 0) return c;
            c = Integer.compare(a.wltpKm, b.wltpKm);
            if (c != 0) return c;
            c = Double.compare(a.price > 0 ? a.price : Double.MAX_VALUE,
                    b.price > 0 ? b.price : Double.MAX_VALUE);
            if (c != 0) return c;
            return a.version.compareToIgnoreCase(b.version);
        });
'''
          s, n = re.subn(r'        Collections.sort\(all, \(a, b\) -> \{.*?\n        \}\);\n        return all;', search_sort + '        return all;', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('search sort replacement failed')

          p.write_text(s, encoding='utf-8')
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java .github/workflows/_tmp_catalog_order.yml
          git commit -m "chore: optimize compare screen startup"
          git rm .github/workflows/_tmp_catalog_order.yml
          git commit --amend --no-edit
          git push origin HEAD:main
