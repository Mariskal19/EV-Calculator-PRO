name: Apply blue OK status card
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply blue gradient to OK card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/MainActivity.java')
          s=p.read_text()
          old='statusBox.setBackground(bg(ok?statusOk:statusWarn,22,0));'
          new='if(ok){ GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, new int[]{Color.rgb(18,82,214),Color.rgb(54,184,255)}); g.setCornerRadius(dp(22)); statusBox.setBackground(g); } else { statusBox.setBackground(bg(statusWarn,22,0)); }'
          if old not in s:
              print('Already updated or pattern not found; no changes needed.')
          else:
              p.write_text(s.replace(old,new,1))
          PY
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/MainActivity.java
          git commit -m 'style: use blue gradient for OK departure card'
          git push
