name: Fix SEALION 7 duplicates
on:
  push:
    paths:
      - '.github/scripts/fix_sealion7_duplicates.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove duplicate records
        run: python3 .github/scripts/fix_sealion7_duplicates.py
      - name: Commit catalog if changed
        run: |
          if git diff --quiet -- app/src/main/assets/catalog_es_2024_2026.json; then
            echo 'No catalog changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/catalog_es_2024_2026.json
          git commit -m 'catalog: remove duplicate Sealion 7 records'
          git push
