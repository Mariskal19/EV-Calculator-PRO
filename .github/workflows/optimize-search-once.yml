name: One-time search optimization
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize search
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text()
          old='input.postDelayed(()->renderSearchResults(input,list),120);'
          s=s.replace(old,'renderSearchResults(input,list);')
          old='input.requestFocus();input.post(()->{InputMethodManager imm=(InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);if(imm!=null)imm.showSoftInput(input,InputMethodManager.SHOW_IMPLICIT);});});input.addTextChangedListener'
          new='input.requestFocus();});input.addTextChangedListener'
          s=s.replace(old,new)
          old_click='selectedIds.add(v.id);SharedPreferences prefs=getSharedPreferences(PREFS,MODE_PRIVATE);prefs.edit().putInt(KEY_SEARCH_COUNT_PREFIX+v.id,prefs.getInt(KEY_SEARCH_COUNT_PREFIX+v.id,0)+1).apply();saveSelection();rebuild();Object tag=input.getTag();if(tag instanceof AlertDialog)((AlertDialog)tag).dismiss();'
          new_click='Object tag=input.getTag();if(tag instanceof AlertDialog)((AlertDialog)tag).dismiss();selectedIds.add(v.id);SharedPreferences prefs=getSharedPreferences(PREFS,MODE_PRIVATE);prefs.edit().putInt(KEY_SEARCH_COUNT_PREFIX+v.id,prefs.getInt(KEY_SEARCH_COUNT_PREFIX+v.id,0)+1).apply();saveSelection();input.post(()->rebuild());'
          s=s.replace(old_click,new_click)
          start=s.index('    private void renderSearchResults(')
          end=s.index('    private void addSearchItem(',start)
          method='    private void renderSearchResults(EditText input,LinearLayout list){list.removeAllViews();String q=input.getText()==null?"":input.getText().toString().trim().toLowerCase(Locale.ROOT);List<Vehicle>all=orderedSearchVehicles(q);if(q.isEmpty()){TextView header=tv("Todos los vehículos",13,blue);header.setTypeface(null,Typeface.BOLD);header.setPadding(dp(18),dp(16),dp(18),dp(7));list.addView(header,new LinearLayout.LayoutParams(-1,dp(38)));}for(Vehicle v:all)addSearchItem(v,list,input);if(!q.isEmpty()&&all.isEmpty()){TextView none=tv("No se encontraron vehículos",14,sub());none.setGravity(Gravity.CENTER);none.setPadding(dp(12),dp(20),dp(12),dp(20));list.addView(none,new LinearLayout.LayoutParams(-1,dp(60)));}}\n'
          s=s[:start]+method+s[end:]
          p.write_text(s)
      - name: Remove popular-only helpers
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text()
          s=re.sub(r'    private int curatedPopularRank\(Vehicle v\).*?\n    private int trimRank', '    private int trimRank', s, count=1, flags=re.S)
          s=re.sub(r'    private List<Vehicle> popularVehicles\(List<Vehicle>all\).*?\n    private void renderSearchResults', '    private void renderSearchResults', s, count=1, flags=re.S)
          p.write_text(s)
      - name: Commit source and remove this workflow
        run: |
          rm -f .github/workflows/optimize-search-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java .github/workflows/optimize-search-once.yml
          git commit -m "Simplify compare search listing and responsiveness"
          git push
      - name: Trigger build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'
