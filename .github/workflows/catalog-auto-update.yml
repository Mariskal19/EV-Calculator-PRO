name: Automatic protected catalog update

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "tools/update_protected_catalog.py"
      - "app/src/main/assets/catalog_remote_exclusions.json"
      - ".github/workflows/catalog-auto-update.yml"
  schedule:
    - cron: "0 15 * * *"
      timezone: "Europe/Madrid" # Daily automatic catalog sync at 15:00 Spain time

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update catalog from external JSON sources
        env:
          CATALOG_SOURCE_1_URL: https://gaia-charge.github.io/evdb/v1/vehicles.json
          CATALOG_SOURCE_2_URL: ${{ vars.CATALOG_SOURCE_2_URL }}
        run: python3 tools/update_protected_catalog.py

      - name: Open pull request for validated catalog changes
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          catalog_file="app/src/main/assets/catalog_remote_additions.json"
          if git diff --quiet -- "$catalog_file"; then
            echo "No catalog changes."
            exit 0
          fi

          branch="automation/catalog-sync-${RUN_ID}-${RUN_ATTEMPT}"
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$catalog_file"
          git commit -m "Catalog: sync validated remote configurations"
          git push --set-upstream origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Catalog: sync validated remote configurations" \
            --body "Automated catalog update. The protected base catalog is not modified; this PR contains only validated changes to catalog_remote_additions.json. Please review before merging."

          # PRs created with GITHUB_TOKEN do not emit a pull_request event that
          # starts another workflow. Dispatch the same validation workflow on
          # the PR head so its required check is attached to the exact commit.
          gh workflow run pull-request-validation.yml --ref "$branch"
          echo "Dispatched required PR validation for $branch."
