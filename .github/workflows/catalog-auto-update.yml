name: Automatic protected catalog update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update catalog from external JSON sources
        env:
          CATALOG_SOURCE_1_URL: ${{ vars.CATALOG_SOURCE_1_URL }}
          CATALOG_SOURCE_2_URL: ${{ vars.CATALOG_SOURCE_2_URL }}
        run: python3 tools/update_protected_catalog.py

      - name: Commit only new remote configurations
        run: |
          if git diff --quiet -- app/src/main/assets/catalog_remote_additions.json; then
            echo "No new validated configurations."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/catalog_remote_additions.json
          git commit -m "Catalog: publish new validated configurations remotely"
          git push
