name: One-time top spacing fix

on:
  push:
    branches: [ feature/statusbar-unification ]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply unified top spacing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove artificial top padding from screens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              'app/src/main/java/com/evchargecalculator/MainActivity.java',
              'app/src/main/java/com/evchargecalculator/ConfigurationActivity.java',
              'app/src/main/java/com/evchargecalculator/ElectricVsCombustionActivity.java',
          ]
          old = 'root.setPadding(0, dp(36), 0, dp(16));'
          new = 'root.setPadding(0, 0, 0, dp(16));'
          for name in files:
              p = Path(name)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected padding not found in {name}')
              p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/MainActivity.java app/src/main/java/com/evchargecalculator/ConfigurationActivity.java app/src/main/java/com/evchargecalculator/ElectricVsCombustionActivity.java .github/workflows/one-time-top-spacing.yml
          git commit -m 'Apply unified top spacing'
          git rm .github/workflows/one-time-top-spacing.yml
          git commit -m 'Remove temporary top spacing workflow'
          git push
