name: One-time fix comparison consumption

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: normalize comparison consumption field') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply compatibility fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text(encoding='utf-8')
          old = '            consumption = o.optDouble("consumption", 0);'
          new = '''            consumption = o.optDouble("consumption", 0);\n            if (consumption <= 0) {\n                consumption = o.optDouble("consumptionKwh100", 0);\n            }'''
          if old not in s:
              raise SystemExit('Expected consumption parser line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-consumption.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java .github/workflows/fix-consumption.yml
          git commit -m 'fix: normalize comparison consumption field'
          git push
