name: AI advisor direct-search debug build

on:
  push:
    branches: [ "fix/ai-direct-catalog-search" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/src/main/java/com/evchargecalculator/SimilarCarsActivity.java'
      - 'app/src/main/java/com/evchargecalculator/AdvisorSimilarityIntent.java'
      - '.github/workflows/ai-search-debug-build.yml'

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Run Android Lint
        continue-on-error: true
        env:
          # Dummy values satisfy the app's configuration-time Release-signing guard.
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/lint-placeholder.keystore
          EV_CALCULATOR_KEYSTORE_PASSWORD: lint-only-placeholder
          EV_CALCULATOR_KEY_ALIAS: lint-only-placeholder
          EV_CALCULATOR_KEY_PASSWORD: lint-only-placeholder
        run: gradle --no-daemon lintDebug

      - name: Build Debug APK
        env:
          # Dummy values satisfy the app's configuration-time Release-signing guard.
          # assembleDebug does not sign with or consume these placeholder credentials.
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/debug-placeholder.keystore
          EV_CALCULATOR_KEYSTORE_PASSWORD: debug-only-placeholder
          EV_CALCULATOR_KEY_ALIAS: debug-only-placeholder
          EV_CALCULATOR_KEY_PASSWORD: debug-only-placeholder
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: EV-Calculator-PRO-ai-search-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
