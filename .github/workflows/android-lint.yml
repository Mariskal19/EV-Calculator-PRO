name: Android Lint audit

on:
  workflow_dispatch:
  push:
    branches:
      - develop/post-1.0.6
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/tests/**'
      - '.github/workflows/android-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Run currency tests, Android Lint and Debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Run currency-rate regression tests
        run: |
          mkdir -p build/currency-rate-test
          javac -d build/currency-rate-test app/src/main/java/com/evchargecalculator/CurrencyRateRepository.java .github/tests/CurrencyRateRepositorySmokeTest.java
          java -cp build/currency-rate-test com.evchargecalculator.CurrencyRateRepositorySmokeTest

      - name: Run lintDebug
        id: lint
        continue-on-error: true
        env:
          # Dummy values satisfy the app's configuration-time Release-signing guard.
          # lintDebug does not sign an APK and never uses these placeholder credentials.
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/lint-placeholder.keystore
          EV_CALCULATOR_KEYSTORE_PASSWORD: lint-only-placeholder
          EV_CALCULATOR_KEY_ALIAS: lint-only-placeholder
          EV_CALCULATOR_KEY_PASSWORD: lint-only-placeholder
        run: gradle --no-daemon lintDebug

      - name: Build Debug APK
        env:
          # Dummy values satisfy the app's configuration-time Release-signing guard.
          # assembleDebug does not sign with or consume these placeholder credentials.
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/lint-placeholder.keystore
          EV_CALCULATOR_KEYSTORE_PASSWORD: lint-only-placeholder
          EV_CALCULATOR_KEY_ALIAS: lint-only-placeholder
          EV_CALCULATOR_KEY_PASSWORD: lint-only-placeholder
        run: gradle --no-daemon assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ev-calculator-pro-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android Lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Report audit status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.lint.outcome }}" = "success" ]; then
            echo "Android Lint completed without a Gradle task failure." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Android Lint reported issues or failed. Download the report artifact and review findings before changing source code." >> "$GITHUB_STEP_SUMMARY"
          fi
