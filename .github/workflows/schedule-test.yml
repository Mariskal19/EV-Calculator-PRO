name: GitHub schedule test

on:
  schedule:
    - cron: "00 15 * * *"
  workflow_dispatch:

jobs:
  schedule-test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled execution
        run: |
          echo "SCHEDULE TEST UTC OK"
          echo "UTC: $(date -u)"
          echo "Madrid: $(TZ=Europe/Madrid date)"
