name: GitHub schedule test

on:
  schedule:
    - cron: "10 17 * * *"
  workflow_dispatch:

jobs:
  schedule-test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled execution
        run: |
          echo "SCHEDULE TEST 19:10 MADRID OK"
          echo "UTC: $(date -u)"
          echo "Madrid: $(TZ=Europe/Madrid date)"
