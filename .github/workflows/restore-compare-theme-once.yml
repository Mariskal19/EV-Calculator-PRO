name: Restore compare theme source once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore and fix compare activity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout 3cf83dd59a4b28e7cd47cc3c5a9d2c1c002c5272 -- app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text(encoding='utf-8')
          bad = 'heroImage.setImageResource(R.drawable.cabecera_tema_oscuro);'
          good = 'heroImage.setImageResource(R.drawable.cabecera_tema_claro); heroImage.setColorFilter(dark ? 0x88000000 : Color.TRANSPARENT, android.graphics.PorterDuff.Mode.SRC_OVER);'
          if bad not in s:
              raise SystemExit('Expected broken dark header reference was not found')
          s = s.replace(bad, good, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java .github/workflows/restore-compare-theme-once.yml
          git commit -m "Fix compare dark theme header resource"
          git rm .github/workflows/restore-compare-theme-once.yml
          git commit -m "Remove one-time compare theme repair workflow"
          git push origin main
