name: Restore compare theme source once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore known-good compare activity and apply theme fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout 3cf83dd59a4b28e7cd47cc3c5a9d2c1c002c5272 -- app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text(encoding='utf-8')
          light = 'heroImage.setImageResource(R.drawable.cabecera_tema_claro);'
          fixed = 'heroImage.setImageResource(R.drawable.cabecera_tema_claro); heroImage.setColorFilter(dark ? 0x88000000 : Color.TRANSPARENT, android.graphics.PorterDuff.Mode.SRC_OVER);'
          if 'heroImage.setColorFilter' not in s:
              if light not in s:
                  raise SystemExit('Could not locate existing compare header drawable line')
              s = s.replace(light, fixed, 1)
          p.write_text(s, encoding='utf-8')
          print('Restored known-good Compare activity and applied dark header filter.')
          PY
          grep -q 'public class CompararCochesActivity' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          grep -q 'heroImage.setColorFilter' app/src/main/java/com/evchargecalculator/CompararCochesActivity.java

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java .github/workflows/restore-compare-theme-once.yml
          git commit -m "Restore compare screen and fix dark header"
          git rm .github/workflows/restore-compare-theme-once.yml
          git commit -m "Remove one-time compare theme repair workflow"
          git push origin main
