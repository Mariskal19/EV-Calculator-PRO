name: Bottom navigation Android debug build

on:
  push:
    branches: [ "feature/bottom-navigation-fixed" ]
    paths:
      - 'app/src/main/java/com/evchargecalculator/MainActivity.java'
      - 'app/src/main/java/com/evchargecalculator/PersistentMainActivity.java'
      - 'app/src/main/java/com/evchargecalculator/BaseNavigationActivity.java'
      - 'app/src/main/java/com/evchargecalculator/BottomNavigationHelper.java'
      - 'app/src/main/java/com/evchargecalculator/AppMenuHelper.java'
      - 'app/src/main/java/com/evchargecalculator/ElectricVsCombustionActivity.java'
      - 'app/src/main/java/com/evchargecalculator/ElectricVsCombustionScreen.java'
      - 'app/src/main/java/com/evchargecalculator/SimilarCarsActivity.java'
      - 'app/src/main/java/com/evchargecalculator/SimilarCarsScreen.java'
      - 'app/src/main/java/com/evchargecalculator/CompararCochesScreen.java'
      - 'app/src/main/java/com/evchargecalculator/CompararCochesActivity.java'
      - 'app/src/main/java/com/evchargecalculator/CarDetailActivity.java'
      - 'app/src/main/java/com/evchargecalculator/ConfigurationActivity.java'
      - 'app/src/main/java/com/evchargecalculator/SupportProjectActivity.java'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'app/src/main/res/values/themes.xml'
      - 'app/src/main/res/values/styles.xml'
      - 'app/src/main/res/anim/no_transition.xml'
      - '.github/workflows/advisor-android-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      # Gradle validates release-signing environment during configuration.
      # Supply a disposable CI-only key; assembleDebug does not use release signing.
      - name: Configure disposable signing values for Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/navigation-ci-only.jks"
          keytool -genkeypair -noprompt -keystore "$keystore" -storepass navigation-ci-only -keypass navigation-ci-only -alias navigation-ci-only -dname "CN=Navigation CI Only" -keyalg RSA -keysize 2048 -validity 2
          {
            echo "EV_CALCULATOR_KEYSTORE_PATH=$keystore"
            echo "EV_CALCULATOR_KEYSTORE_PASSWORD=navigation-ci-only"
            echo "EV_CALCULATOR_KEY_ALIAS=navigation-ci-only"
            echo "EV_CALCULATOR_KEY_PASSWORD=navigation-ci-only"
          } >> "$GITHUB_ENV"

      - name: Build debug APK only
        run: gradle --no-daemon clean assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v6
        with:
          name: EV-Calculator-PRO-bottom-navigation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
