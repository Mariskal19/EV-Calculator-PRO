name: One-off language refresh patch

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply language refresh fix
        shell: python
        run: |
          from pathlib import Path

          main = Path('app/src/main/java/com/evchargecalculator/MainActivity.java')
          s = main.read_text(encoding='utf-8')
          old = 'ScrollView scroll; LinearLayout root; PremiumBackgroundView background; EditText battery,power,price,departure,xguard; SeekBar batS; BatteryRangeView range; Switch xSwitch; TextView timeR,energyR,costR,statusR,statusTimeR,statusIcon,themeButton,rangeSummary,chargeAmount,lossInfo,priceUnit; LinearLayout statusBox; boolean busy,dark=false; SharedPreferences prefs;'
          new = 'ScrollView scroll; LinearLayout root; PremiumBackgroundView background; EditText battery,power,price,departure,xguard; SeekBar batS; BatteryRangeView range; Switch xSwitch; TextView timeR,energyR,costR,statusR,statusTimeR,statusIcon,themeButton,rangeSummary,chargeAmount,lossInfo,priceUnit; LinearLayout statusBox; boolean busy,dark=false; SharedPreferences prefs; String lastLanguage;'
          if old not in s:
              raise SystemExit('MainActivity field pattern not found')
          s = s.replace(old, new, 1)
          old = '@Override public void onCreate(Bundle b){super.onCreate(b);getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);prefs=getSharedPreferences("ev_charge_calculator",MODE_PRIVATE);dark=prefs.contains(KEY_DARK_THEME)?prefs.getBoolean(KEY_DARK_THEME,false):(getResources().getConfiguration().uiMode & 0x30)==0x20;build();loadPreferences();applyTheme();calculate();}'
          new = '@Override public void onCreate(Bundle b){super.onCreate(b);getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);prefs=getSharedPreferences("ev_charge_calculator",MODE_PRIVATE);dark=prefs.contains(KEY_DARK_THEME)?prefs.getBoolean(KEY_DARK_THEME,false):(getResources().getConfiguration().uiMode & 0x30)==0x20;build();loadPreferences();applyTheme();calculate();lastLanguage=LanguageManager.getSelectedLanguage(this);}'
          if old not in s:
              raise SystemExit('MainActivity onCreate pattern not found')
          s = s.replace(old, new, 1)
          old = '@Override protected void onResume(){super.onResume();if(battery!=null&&!busy){applyCurrency();calculate();}}'
          new = '@Override protected void onResume(){super.onResume();if(battery!=null&&!busy){String currentLanguage=LanguageManager.getSelectedLanguage(this);if(lastLanguage==null||!currentLanguage.equals(lastLanguage)){lastLanguage=currentLanguage;LanguageManager.translateViews(this);}applyCurrency();calculate();}}'
          if old not in s:
              raise SystemExit('MainActivity onResume pattern not found')
          s = s.replace(old, new, 1)
          main.write_text(s, encoding='utf-8')

          electric = Path('app/src/main/java/com/evchargecalculator/ElectricVsCombustionActivity.java')
          s = electric.read_text(encoding='utf-8')
          old = 'private boolean dark; private SharedPreferences prefs; private ScrollView scroll;'
          new = 'private boolean dark; private SharedPreferences prefs; private ScrollView scroll; private String lastLanguage;'
          if old not in s:
              raise SystemExit('Electric field pattern not found')
          s = s.replace(old, new, 1)
          old = '@Override public void onCreate(Bundle b){super.onCreate(b);prefs=getSharedPreferences(PREFS,MODE_PRIVATE);dark=prefs.contains(KEY_DARK_THEME)?prefs.getBoolean(KEY_DARK_THEME,false):(getResources().getConfiguration().uiMode&Configuration.UI_MODE_NIGHT_MASK)==Configuration.UI_MODE_NIGHT_YES;getWindow().setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);build();load();applyCurrency();calculate();}'
          new = '@Override public void onCreate(Bundle b){super.onCreate(b);prefs=getSharedPreferences(PREFS,MODE_PRIVATE);dark=prefs.contains(KEY_DARK_THEME)?prefs.getBoolean(KEY_DARK_THEME,false):(getResources().getConfiguration().uiMode&Configuration.UI_MODE_NIGHT_MASK)==Configuration.UI_MODE_NIGHT_YES;getWindow().setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);build();load();applyCurrency();calculate();lastLanguage=LanguageManager.getSelectedLanguage(this);}'
          if old not in s:
              raise SystemExit('Electric onCreate pattern not found')
          s = s.replace(old, new, 1)
          old = '@Override protected void onResume(){super.onResume();if(prefs==null)prefs=getSharedPreferences(PREFS,MODE_PRIVATE);if(prefs.contains(KEY_DARK_THEME)){boolean selectedDark=prefs.getBoolean(KEY_DARK_THEME,false);if(selectedDark!=dark){dark=selectedDark;build();load();applyCurrency();calculate();return;}}if(distance!=null){applyCurrency();calculate();}}'
          new = '@Override protected void onResume(){super.onResume();if(prefs==null)prefs=getSharedPreferences(PREFS,MODE_PRIVATE);if(prefs.contains(KEY_DARK_THEME)){boolean selectedDark=prefs.getBoolean(KEY_DARK_THEME,false);if(selectedDark!=dark){dark=selectedDark;build();load();applyCurrency();calculate();return;}}if(distance!=null){String currentLanguage=LanguageManager.getSelectedLanguage(this);if(lastLanguage==null||!currentLanguage.equals(lastLanguage)){lastLanguage=currentLanguage;LanguageManager.translateViews(this);}applyCurrency();calculate();}}'
          if old not in s:
              raise SystemExit('Electric onResume pattern not found')
          s = s.replace(old, new, 1)
          electric.write_text(s, encoding='utf-8')
      
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/oneoff-language-refresh.yml
          git add app/src/main/java/com/evchargecalculator/MainActivity.java app/src/main/java/com/evchargecalculator/ElectricVsCombustionActivity.java .github/workflows/oneoff-language-refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: refresh language when returning to calculator screens"
          git push
