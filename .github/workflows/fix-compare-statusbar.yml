name: Fix Compare Cars status bar
on:
  push:
    branches: [feature/automatizacion-coches]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/automatizacion-coches
          fetch-depth: 0
      - name: Adjust header below status bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text()
          old='''    root.setOrientation(LinearLayout.VERTICAL);\n    root.setBackgroundColor(dark?Color.rgb(7,19,28):Color.rgb(241,246,251));'''
          new='''    root.setOrientation(LinearLayout.VERTICAL);\n    int statusBarHeight=0;\n    int statusBarId=getResources().getIdentifier("status_bar_height","dimen","android");\n    if(statusBarId>0)statusBarHeight=getResources().getDimensionPixelSize(statusBarId);\n    root.setPadding(0,statusBarHeight,0,0);\n    root.setBackgroundColor(dark?Color.rgb(7,19,28):Color.rgb(241,246,251));'''
          if old not in s:
              raise SystemExit('Expected header setup not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java .github/workflows/fix-compare-statusbar.yml
          git commit -m "fix: keep compare cars header below status bar"
          git rm .github/workflows/fix-compare-statusbar.yml
          git commit -m "chore: remove temporary status bar workflow"
          git push origin HEAD:feature/automatizacion-coches
