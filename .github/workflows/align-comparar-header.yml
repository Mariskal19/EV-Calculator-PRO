name: Align Comparar header

on:
  push:
    paths:
      - '.github/workflows/align-comparar-header.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Align header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text(encoding='utf-8')
          start = s.index('        FrameLayout hero = new FrameLayout(this);')
          end = s.index('        ScrollView scroll=', start)
          new = '''        FrameLayout hero = new FrameLayout(this); hero.setLayoutParams(new LinearLayout.LayoutParams(-1, dp(260)));\n        ImageView heroImage = new ImageView(this); heroImage.setImageResource(R.drawable.cabecera_ev_calculator); heroImage.setScaleType(ImageView.ScaleType.CENTER_CROP); heroImage.setAdjustViewBounds(false); heroImage.setTranslationY(-dp(10)); hero.addView(heroImage, new FrameLayout.LayoutParams(-1,-1));\n        View topFade = new View(this); topFade.setBackground(new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, new int[]{Color.argb(200,0,0,0),Color.argb(80,0,0,0),Color.argb(20,0,0,0),Color.argb(0,0,0,0)})); hero.addView(topFade, new FrameLayout.LayoutParams(-1,dp(170),Gravity.TOP));\n        TextView back = tv("‹",40,Color.WHITE); back.setGravity(Gravity.CENTER); back.setTypeface(null,Typeface.BOLD); back.setShadowLayer(dp(4),0,dp(2),Color.argb(90,0,0,0)); back.setOnClickListener(v->finish()); FrameLayout.LayoutParams bp=new FrameLayout.LayoutParams(dp(40),dp(40),Gravity.TOP|Gravity.START); bp.leftMargin=dp(14); bp.topMargin=dp(12); hero.addView(back,bp);\n        TextView title = tv("Comparar coches",22,Color.WHITE); title.setTypeface(null,Typeface.BOLD); title.setGravity(Gravity.CENTER); title.setTextAlignment(View.TEXT_ALIGNMENT_CENTER); title.setShadowLayer(dp(4),0,dp(2),Color.argb(90,0,0,0)); FrameLayout.LayoutParams tp=new FrameLayout.LayoutParams(-1,dp(56)); tp.gravity=Gravity.TOP|Gravity.CENTER_HORIZONTAL; tp.leftMargin=dp(40); tp.rightMargin=dp(40); tp.topMargin=dp(4); hero.addView(title,tp);\n        TextView menuButton = tv("⋮",30,Color.WHITE); menuButton.setGravity(Gravity.CENTER); menuButton.setIncludeFontPadding(false); menuButton.setTextAlignment(View.TEXT_ALIGNMENT_CENTER); menuButton.setPadding(0,0,0,0); menuButton.setShadowLayer(dp(4),0,dp(2),Color.argb(90,0,0,0)); menuButton.setBackgroundColor(Color.TRANSPARENT); menuButton.setContentDescription(LanguageManager.t(this,"Menú")); menuButton.setOnClickListener(v->AppMenuHelper.show(this,menuButton,new AppMenuHelper.Listener(){ public boolean isDark(){return dark;} public void setDark(boolean value){if(dark!=value){dark=value;getSharedPreferences(PREFS,MODE_PRIVATE).edit().putBoolean("dark_theme",dark).apply();loadSelection();build();rebuild();}} })); FrameLayout.LayoutParams mbp=new FrameLayout.LayoutParams(dp(40),dp(40),Gravity.TOP|Gravity.END); mbp.rightMargin=dp(14); mbp.topMargin=dp(12); hero.addView(menuButton,mbp);\n        root.addView(hero);\n'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'fix: align Comparar coches header'
          git push
