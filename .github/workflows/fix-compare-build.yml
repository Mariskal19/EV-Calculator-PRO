name: Fix compare cars build
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/automatizacion-coches
      - name: Fix compile error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text()
          old='getSharedPreferences(PREFS,MODE_PRIVATE).edit().putBoolean("dark_theme",dark).apply();rebuildTheme();'
          new='getSharedPreferences(PREFS,MODE_PRIVATE).edit().putBoolean("dark_theme",dark).apply();build();loadSelection();rebuild();'
          if old not in s:
              raise SystemExit('Expected compile-error pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'fix: rebuild compare cars after theme change'
          git push origin HEAD:feature/automatizacion-coches
      - name: Trigger build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref feature/automatizacion-coches
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-compare-build.yml
          git commit -m 'chore: remove temporary build fix workflow'
          git push origin HEAD:feature/automatizacion-coches
