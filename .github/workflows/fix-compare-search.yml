name: Fix compare search newline

on:
  push:
    branches: [main]

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'replace compare search label method safely')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Java source
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text(encoding='utf-8')
          start=s.index('    private String searchLabel(Vehicle v){')
          end=s.index('    private List<Vehicle> orderedSearchVehicles(String q){',start)
          method='    private String searchLabel(Vehicle v){String first=v.make+" "+v.model;String second=v.year>0?"MY"+String.valueOf(v.year).substring(Math.max(0,String.valueOf(v.year).length()-2))+". ":"";if(v.version!=null&&!v.version.trim().isEmpty()){String ver=v.version.trim();ver=ver.replaceFirst("(?i)^\\\\d+(?:\\\\.\\\\d+)?\\\\s*kwh\\\\s*","");second+=ver;}return first+"\\\\n"+second;}\n'
          s=s[:start]+method+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m "fix: repair compare search label method"
          git push
          rm -f .github/workflows/fix-compare-search.yml
          git add .github/workflows/fix-compare-search.yml
          git commit -m "chore: remove temporary search fix workflow"
          git push
