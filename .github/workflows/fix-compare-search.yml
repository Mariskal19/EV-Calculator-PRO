name: Fix compare search newline

on:
  push:
    branches: [main]

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'fix compare search newline')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Java source
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text(encoding='utf-8')
          bad='return first+"\n"+second;'
          good='return first+"\\n"+second;'
          if bad not in s:
              raise SystemExit('malformed searchLabel return not found')
          s=s.replace(bad,good,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m "fix: compare search label newline"
          git push
          rm -f .github/workflows/fix-compare-search.yml
          git add .github/workflows/fix-compare-search.yml
          git commit -m "chore: remove temporary search fix workflow"
          git push
