name: Fix compare search newline

on:
  push:
    branches: [main]

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'make compare search newline patch robust')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Java source
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text(encoding='utf-8')
          pattern=r'return first\+"[^"\\]*"\+second;'
          matches=list(re.finditer(pattern,s))
          if not matches:
              raise SystemExit('searchLabel return target not found')
          start,end=matches[0].span()
          s=s[:start]+'return first+"\\n"+second;'+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m "fix: repair compare search label newline"
          git push
          rm -f .github/workflows/fix-compare-search.yml
          git add .github/workflows/fix-compare-search.yml
          git commit -m "chore: remove temporary search fix workflow"
          git push
