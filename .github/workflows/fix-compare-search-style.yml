name: Temporary Compare Search Style Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply search result styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text(encoding='utf-8')
          if 'import android.text.SpannableString;' not in s:
              s = s.replace('import android.text.TextWatcher;','import android.text.TextWatcher;\nimport android.text.SpannableString;\nimport android.text.Spanned;\nimport android.text.style.RelativeSizeSpan;\nimport android.text.style.StyleSpan;')
          s = s.replace('return first+"\\\\n"+second;', 'return first+"\\n"+second;')
          s = re.sub(r'private void addSearchItem\(.*?\}\n    private String value', '''private void addSearchItem(Vehicle v,EditText input,LinearLayout list){\n        SpannableString label=new SpannableString(searchLabel(v));\n        int nl=label.toString().indexOf("\\n");\n        if(nl>=0){\n            label.setSpan(new StyleSpan(Typeface.BOLD),0,nl,Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);\n            label.setSpan(new RelativeSizeSpan(0.87f),nl+1,label.length(),Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);\n        }else{\n            label.setSpan(new StyleSpan(Typeface.BOLD),0,label.length(),Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);\n        }\n        TextView item=tv(label.toString(),15,text());\n        item.setText(label);\n        item.setLineSpacing(0,1.08f);\n        item.setPadding(dp(18),dp(10),dp(18),dp(10));\n        item.setBackgroundColor(dark?Color.rgb(15,27,39):Color.WHITE);\n        item.setOnClickListener(x->{if(selectedIds.size()<3){SharedPreferences p=getSharedPreferences(PREFS,MODE_PRIVATE);p.edit().putInt(KEY_SEARCH_COUNT_PREFIX+v.id,p.getInt(KEY_SEARCH_COUNT_PREFIX+v.id,0)+1).apply();selectedIds.add(v.id);saveSelection();AlertDialog dialog=(AlertDialog)input.getTag();if(dialog!=null&&dialog.isShowing())dialog.dismiss();rebuild();}});\n        list.addView(item,new LinearLayout.LayoutParams(-1,-2));\n    }\n    private String value''', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-compare-search-style.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java .github/workflows/fix-compare-search-style.yml
          git commit -m 'fix: improve compare search result hierarchy'
          git push
