name: Advisor engine smoke tests

on:
  push:
    branches: [ "feature/asesor-ia-fase-1" ]
    paths:
      - 'app/src/main/java/com/evchargecalculator/AdvisorCriteriaEngine.java'
      - 'app/src/main/java/com/evchargecalculator/AdvisorSimilarityIntent.java'
      - 'app/src/main/java/com/evchargecalculator/SimilarCarsActivity.java'
      - 'app/src/main/java/com/evchargecalculator/AdvisorCatalogMatcher.java'
      - '.github/tests/AdvisorCriteriaEngineSmokeTest.java'
      - 'app/src/main/java/com/evchargecalculator/AdvisorSimilarityIntent.java'
      - '.github/tests/AdvisorCatalogIntegrationSmokeTest.java'
      - '.github/tests/project_protected_catalog.py'
      - 'app/src/main/assets/catalog_es_2024_2026.json'
      - '.github/workflows/advisor-engine-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile isolated interpreter and smoke tests
        run: |
          mkdir -p build/advisor-test
          python3 .github/tests/project_protected_catalog.py app/src/main/assets/catalog_es_2024_2026.json build/advisor-test/catalog.tsv
          javac -d build/advisor-test app/src/main/java/com/evchargecalculator/AdvisorCriteriaEngine.java app/src/main/java/com/evchargecalculator/AdvisorCatalogMatcher.java app/src/main/java/com/evchargecalculator/AdvisorSimilarityIntent.java .github/tests/AdvisorCriteriaEngineSmokeTest.java .github/tests/AdvisorCatalogIntegrationSmokeTest.java
      - name: Run smoke tests
        run: |
          java -cp build/advisor-test com.evchargecalculator.AdvisorCriteriaEngineSmokeTest
          java -cp build/advisor-test com.evchargecalculator.AdvisorCatalogIntegrationSmokeTest build/advisor-test/catalog.tsv
