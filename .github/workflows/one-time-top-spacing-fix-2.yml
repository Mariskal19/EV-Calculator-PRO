name: One-time top spacing fix 2
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicated top spacing from principal and comparison
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('app/src/main/java/com/evchargecalculator/PrincipalActivity.java'),
              Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java'),
          ]
          for p in files:
              s = p.read_text()
              s2 = s.replace('root.setPadding(0, dp(36), 0, dp(0));', 'root.setPadding(0, dp(0), 0, dp(0));')
              s2 = s2.replace('root.setPadding(0, statusBarHeight, 0, 0);', 'root.setPadding(0, 0, 0, 0);')
              if s2 == s:
                  raise SystemExit(f'No expected top padding found in {p}')
              p.write_text(s2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/PrincipalActivity.java app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'Fix top spacing on principal and comparison screens'
          git push
