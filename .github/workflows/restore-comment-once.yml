name: Restore compare comment
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compare comment
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s=p.read_text(encoding='utf-8')
          old='summary.addView(card,new LinearLayout.LayoutParams(-1,-2));}'
          new='TextView commentTitle=tv("Comentario",14,blue);commentTitle.setTypeface(null,Typeface.BOLD);commentTitle.setPadding(0,dp(14),0,dp(4));card.addView(commentTitle,new LinearLayout.LayoutParams(-1,dp(30)));TextView comment=tv(summaryComment(),13,sub());comment.setLineSpacing(0,1.15f);comment.setPadding(0,dp(2),0,dp(2));card.addView(comment,new LinearLayout.LayoutParams(-1,-2));summary.addView(card,new LinearLayout.LayoutParams(-1,-2));}'
          if old in s and 'private String summaryComment()' not in s:
              s=s.replace(old,new,1)
              marker='    private String empty(String s){'
              helper='    private String summaryComment(){List<Vehicle> chosen=new ArrayList<>();for(String id:selectedIds){Vehicle v=find(id);if(v!=null)chosen.add(v);}if(chosen.size()<2)return"";Vehicle bestRange=bestVehicle("range",true),bestCons=bestVehicle("cons",false),bestPrice=bestVehicle("price",false);StringBuilder out=new StringBuilder();out.append("En conjunto, ");if(bestRange!=null)out.append(bestRange.make).append(" ").append(bestRange.model).append(" destaca por autonomía");if(bestCons!=null&&bestCons!=bestRange)out.append(", mientras que ").append(bestCons.make).append(" ").append(bestCons.model).append(" ofrece el menor consumo");if(bestPrice!=null&&bestPrice!=bestRange&&bestPrice!=bestCons)out.append(" y ").append(bestPrice.make).append(" ").append(bestPrice.model).append(" es la opción más económica");out.append(". La elección final dependerá de si priorizas autonomía, eficiencia, prestaciones, velocidad de carga o precio.");return out.toString();}\n    private Vehicle bestVehicle(String key,boolean higherBetter){Vehicle bestV=null;double best=Double.NaN;for(String id:selectedIds){Vehicle v=find(id);if(v==null)continue;double n=numeric(v,key);if(Double.isNaN(n))continue;if(Double.isNaN(best)||(higherBetter?n>best:n<best)){best=n;bestV=v;}}return bestV;}\n'
              s=s.replace(marker,helper+marker,1)
              p.write_text(s,encoding='utf-8')
          else:
              raise SystemExit('target not found or already patched')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'restore compare comment'
          git push
          rm .github/workflows/restore-comment-once.yml
          git add .github/workflows/restore-comment-once.yml
          git commit -m 'remove temporary compare restore workflow'
          git push