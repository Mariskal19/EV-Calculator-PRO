name: TMP Audit Kia catalog

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract Kia entries
        run: |
          python3 - <<'PY'
          import json, re
          from collections import defaultdict
          p='app/src/main/assets/catalog_es_2024_2026.json'
          data=json.load(open(p,encoding='utf-8'))
          kia=[v for v in data['vehicles'] if v.get('make','').lower()=='kia']
          groups=defaultdict(list)
          for i,v in enumerate(kia):
              groups[v.get('model','')].append((i,v))
          lines=[f'KIA TOTAL: {len(kia)} entries']
          for model,items in groups.items():
              lines.append(f'\n## {model} ({len(items)})')
              for i,v in items:
                  lines.append(f"{i}|MY{str(v.get('year',''))[-2:]}|{v.get('version','')}|{v.get('batteryKwh')} kWh|{v.get('powerKw')} kW|{v.get('drive') or v.get('drivetrain')}|{v.get('wltpKm')} km|{v.get('consumptionKwh100')} kWh/100")
          open('kia_audit_summary.txt','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          PY
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kia_audit_summary.txt
          git diff --cached --quiet || git commit -m 'chore: update temporary Kia audit summary'
          git push
