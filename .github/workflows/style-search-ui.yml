name: Style vehicle search UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh search UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text()

          old = '''        input.setSingleLine(true);\n        input.setHint(LanguageManager.t(this,"Marca, modelo, año, batería o versión"));\n        input.setTextColor(text());\n        input.setHintTextColor(sub());'''
          new = '''        input.setSingleLine(true);\n        input.setHint(LanguageManager.t(this,"Marca, modelo, año, batería o versión"));\n        input.setTextColor(text());\n        input.setHintTextColor(sub());\n        input.setTextSize(15);\n        input.setSingleLine(true);\n        input.setPadding(dp(14),0,dp(14),0);\n        input.setBackground(strokeBg(dark?Color.rgb(20,35,49):Color.rgb(247,250,254),dark?Color.rgb(59,84,106):Color.rgb(211,223,236),16));'''
          if old not in s: raise SystemExit('search input anchor not found')
          s = s.replace(old, new, 1)

          old = '''        marketRow.setGravity(Gravity.CENTER_VERTICAL);\n        marketRow.setPadding(dp(18),dp(8),dp(18),dp(2));\n        TextView marketTitle=tv("Mercado",14,text());\n        marketTitle.setTypeface(null,Typeface.BOLD);\n        marketRow.addView(marketTitle,new LinearLayout.LayoutParams(0,dp(48),1));'''
          new = '''        marketRow.setGravity(Gravity.CENTER_VERTICAL);\n        marketRow.setPadding(dp(18),dp(12),dp(18),dp(6));\n        TextView marketTitle=tv("Mercado",12,sub());\n        marketTitle.setTypeface(null,Typeface.BOLD);\n        marketTitle.setGravity(Gravity.CENTER_VERTICAL|Gravity.START);\n        marketRow.addView(marketTitle,new LinearLayout.LayoutParams(0,dp(38),1));'''
          if old not in s: raise SystemExit('market row anchor not found')
          s = s.replace(old, new, 1)

          old = '''        searchMarketSpinner.setAdapter(marketAdapter);'''
          new = '''        searchMarketSpinner.setAdapter(marketAdapter);\n        searchMarketSpinner.setBackground(strokeBg(dark?Color.rgb(20,35,49):Color.WHITE,dark?Color.rgb(59,84,106):Color.rgb(211,223,236),14));\n        searchMarketSpinner.setPadding(dp(10),0,dp(8),0);'''
          if old not in s: raise SystemExit('spinner anchor not found')
          s = s.replace(old, new, 1)

          old = '''        marketRow.addView(searchMarketSpinner,new LinearLayout.LayoutParams(dp(190),dp(48)));\n        LinearLayout box=new LinearLayout(this);\n        box.setPadding(dp(18),dp(4),dp(18),dp(2));\n        box.addView(input,new LinearLayout.LayoutParams(-1,dp(52)));'''
          new = '''        marketRow.addView(searchMarketSpinner,new LinearLayout.LayoutParams(dp(190),dp(38)));\n        LinearLayout box=new LinearLayout(this);\n        box.setOrientation(LinearLayout.HORIZONTAL);\n        box.setPadding(dp(18),dp(4),dp(18),dp(10));\n        TextView searchIcon=tv("⌕",23,blue);\n        searchIcon.setGravity(Gravity.CENTER);\n        searchIcon.setTypeface(null,Typeface.BOLD);\n        LinearLayout searchWrap=new LinearLayout(this);\n        searchWrap.setGravity(Gravity.CENTER_VERTICAL);\n        searchWrap.setPadding(dp(10),0,dp(10),0);\n        searchWrap.setBackground(strokeBg(dark?Color.rgb(20,35,49):Color.rgb(247,250,254),dark?Color.rgb(59,84,106):Color.rgb(211,223,236),16));\n        searchWrap.addView(searchIcon,new LinearLayout.LayoutParams(dp(30),dp(52)));\n        input.setBackgroundColor(Color.TRANSPARENT);\n        input.setPadding(0,0,dp(10),0);\n        searchWrap.addView(input,new LinearLayout.LayoutParams(0,dp(52),1));\n        box.addView(searchWrap,new LinearLayout.LayoutParams(0,dp(52),1));'''
          if old not in s: raise SystemExit('search box anchor not found')
          s = s.replace(old, new, 1)

          old = '''        TextView titleView=d.findViewById(getResources().getIdentifier("alertTitle","id","android"));\n            if(titleView!=null)titleView.setTextColor(text());'''
          new = '''        TextView titleView=d.findViewById(getResources().getIdentifier("alertTitle","id","android"));\n            if(titleView!=null){titleView.setTextColor(text());titleView.setTextSize(20);titleView.setTypeface(null,Typeface.BOLD);}'''
          if old not in s: raise SystemExit('dialog title anchor not found')
          s = s.replace(old, new, 1)

          old = '''    private void addSearchItem(Vehicle v,LinearLayout list,EditText input){TextView item=tv(searchLabel(v),14,text());item.setGravity(Gravity.CENTER_VERTICAL);item.setPadding(dp(18),dp(7),dp(18),dp(7));item.setBackgroundColor(list.getChildCount()%2==0?(dark?Color.rgb(18,30,42):Color.WHITE):rowAlt());item.setOnClickListener(x->{selectedIds.add(v.id);SharedPreferences prefs=getSharedPreferences(PREFS,MODE_PRIVATE);prefs.edit().putInt(KEY_SEARCH_COUNT_PREFIX+v.id,prefs.getInt(KEY_SEARCH_COUNT_PREFIX+v.id,0)+1).apply();saveSelection();rebuild();Object tag=input.getTag();if(tag instanceof AlertDialog)((AlertDialog)tag).dismiss();});list.addView(item,new LinearLayout.LayoutParams(-1,dp(54)));}'''
          new = '''    private void addSearchItem(Vehicle v,LinearLayout list,EditText input){\n        TextView item=tv(searchLabel(v),14,text());\n        item.setGravity(Gravity.CENTER_VERTICAL|Gravity.START);\n        item.setPadding(dp(16),dp(6),dp(42),dp(6));\n        item.setLineSpacing(0,1.05f);\n        SpannableString styled=new SpannableString(item.getText());\n        int nl=styled.toString().indexOf('\\n');\n        if(nl>0){\n            styled.setSpan(new StyleSpan(Typeface.BOLD),0,nl,Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);\n            if(nl+1<styled.length())styled.setSpan(new RelativeSizeSpan(0.86f),nl+1,styled.length(),Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);\n        }\n        item.setText(styled);\n        item.setBackground(strokeBg(dark?Color.rgb(18,31,44):Color.WHITE,dark?Color.rgb(43,64,82):Color.rgb(225,233,242),14));\n        item.setOnClickListener(x->{selectedIds.add(v.id);SharedPreferences prefs=getSharedPreferences(PREFS,MODE_PRIVATE);prefs.edit().putInt(KEY_SEARCH_COUNT_PREFIX+v.id,prefs.getInt(KEY_SEARCH_COUNT_PREFIX+v.id,0)+1).apply();saveSelection();rebuild();Object tag=input.getTag();if(tag instanceof AlertDialog)((AlertDialog)tag).dismiss();});\n        LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,dp(60));\n        lp.setMargins(dp(14),dp(3),dp(14),dp(3));\n        list.addView(item,lp);\n    }'''
          if old not in s: raise SystemExit('search item anchor not found')
          s = s.replace(old, new, 1)

          old = '''TextView header=tv("Todos los vehículos",13,blue);header.setTypeface(null,Typeface.BOLD);header.setPadding(dp(18),dp(12),dp(18),dp(6));list.addView(header,new LinearLayout.LayoutParams(-1,dp(32)));'''
          new = '''TextView header=tv("Todos los vehículos",13,blue);header.setTypeface(null,Typeface.BOLD);header.setPadding(dp(18),dp(16),dp(18),dp(7));list.addView(header,new LinearLayout.LayoutParams(-1,dp(38)));'''
          if old not in s: raise SystemExit('all vehicles header anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit visual refresh
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          git commit -m 'Polish vehicle search dialog UI'
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/style-search-ui.yml || true
          git commit -m 'Remove temporary search styling workflow' || true
          git push || true
