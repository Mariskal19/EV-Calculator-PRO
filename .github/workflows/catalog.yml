name: Build and maintain Spanish car catalog

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'app/src/main/assets/catalog_es_2024_2026.json'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate ordered catalog
        run: python3 tools/generate_catalog.py

      - name: Commit updated catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/catalog_es_2024_2026.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
            exit 0
          fi
          git commit -m "chore: regenerate ordered Spanish car catalog"
          git push
