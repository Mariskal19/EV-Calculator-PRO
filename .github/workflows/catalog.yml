name: Validate Spanish car catalog

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/assets/catalog_es_2024_2026.json'

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate final catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('app/src/main/assets/catalog_es_2024_2026.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          vehicles = data.get('vehicles')
          if not isinstance(vehicles, list) or not vehicles: raise SystemExit('Catalog is missing or empty')
          bad_years = [v for v in vehicles if v.get('year') not in (2024, 2025, 2026)]
          if bad_years: raise SystemExit(f'Catalog contains {len(bad_years)} invalid years')
          bad_arrivals = [v for v in vehicles if v.get('arrivalYear') is not None and v.get('arrivalYear') != v.get('year')]
          if bad_arrivals: raise SystemExit(f'Catalog contains {len(bad_arrivals)} records whose year is not the Spanish arrival year')
          missing_consumption = [v for v in vehicles if (v.get('batteryKwh') or 0) > 0 and (v.get('wltpKm') or 0) > 0 and v.get('consumptionKwh100') in (None, '', 0)]
          if missing_consumption: raise SystemExit(f'Catalog has {len(missing_consumption)} configurations without consumptionKwh100')
          print(f'Final Spanish catalog validated: {len(vehicles)} vehicles')
          PY
