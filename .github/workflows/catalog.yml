      - 'app/src/main/assets/vehicle_market_additions_pass35.json'
      - 'app/src/main/assets/vehicle_market_additions_pass36.json'
      - 'app/src/main/assets/vehicle_market_additions_pass37.json'
      - 'app/src/main/assets/vehicle_market_additions_pass38.json'
