name: Temporary Compare i18n Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch translations
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          lm = Path('app/src/main/java/com/evchargecalculator/LanguageManager.java')
          s = lm.read_text(encoding='utf-8')
          start = s.index('  public static String t(Context c, String spanish) {')
          end = s.index('\n  public static void translateViews', start)
          method = '''  public static String t(Context c, String spanish) {
    if (spanish == null || spanish.isEmpty()) return spanish;
    String lang = getSelectedLanguage(c);
    String[] v = TR.get(spanish);
    if (v != null) return translatedValue(v, lang);

    // Also translate Spanish fragments inside dynamic UI strings, for example
    // summary sentences that contain vehicle names and numeric values.
    String result = spanish;
    java.util.List<String> keys = new java.util.ArrayList<>(TR.keySet());
    java.util.Collections.sort(keys, (a, b) -> Integer.compare(b.length(), a.length()));
    for (String key : keys) {
      if (key == null || key.isEmpty() || !result.contains(key)) continue;
      String[] entry = TR.get(key);
      if (entry != null) result = result.replace(key, translatedValue(entry, lang));
    }
    return result;
  }

  private static String translatedValue(String[] v, String lang) {
    int i;
    if ("es".equals(lang)) i = 0;
    else if ("en".equals(lang)) i = 1;
    else if ("fr".equals(lang)) i = 2;
    else if ("de".equals(lang)) i = 3;
    else if ("it".equals(lang)) i = 4;
    else if ("pt".equals(lang)) i = 5;
    else i = 1;
    return (i < v.length && v[i] != null) ? v[i] : v[0];
  }
'''
          lm.write_text(s[:start] + method + s[end:], encoding='utf-8')

          cmp = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          c = cmp.read_text(encoding='utf-8')
          c = c.replace('input.setHint("Marca, modelo, año, batería o versión")', 'input.setHint(LanguageManager.t(this, "Marca, modelo, año, batería o versión"))')
          c = c.replace('.setTitle("Añadir coche")', '.setTitle(LanguageManager.t(this, "Añadir coche"))')
          cmp.write_text(c, encoding='utf-8')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/evchargecalculator/LanguageManager.java app/src/main/java/com/evchargecalculator/CompararCochesActivity.java
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: translate dynamic compare screen text"
            git push
          fi

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/tmp_fix_compare_i18n.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary compare i18n workflow"
          git push
