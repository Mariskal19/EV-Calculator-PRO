name: Temporary compare header overlap v2 trigger 2

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, 'Apply compare header overlap')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply compare header overlap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/evchargecalculator/CompararCochesActivity.java')
          s = p.read_text()
          old = 'NOOP_TRIGGER'
          if old in s:
              raise SystemExit('Unexpected trigger marker')
          PY
      - name: Stop after trigger
        run: echo trigger
