name: Pull request validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  validate:
    name: Currency tests, Android Lint and Debug build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Run currency-rate regression tests
        run: |
          set -euo pipefail
          mkdir -p build/currency-rate-test
          javac -d build/currency-rate-test \
            app/src/main/java/com/evchargecalculator/CurrencyRateRepository.java \
            app/src/main/java/com/evchargecalculator/CurrencyNumberFormatter.java \
            app/src/main/java/com/evchargecalculator/CatalogPriceFormatter.java \
            .github/tests/CurrencyRateRepositorySmokeTest.java
          java -cp build/currency-rate-test com.evchargecalculator.CurrencyRateRepositorySmokeTest

      - name: Run Android Lint
        id: lint
        continue-on-error: true
        env:
          # Dummy values satisfy the configuration-time Release-signing guard.
          # lintDebug does not sign an APK or use these placeholder credentials.
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/lint-placeholder.keystore
          EV_CALCULATOR_KEYSTORE_PASSWORD: lint-only-placeholder
          EV_CALCULATOR_KEY_ALIAS: lint-only-placeholder
          EV_CALCULATOR_KEY_PASSWORD: lint-only-placeholder
        run: gradle --no-daemon lintDebug

      - name: Build Debug APK
        env:
          # assembleDebug does not sign with or consume these placeholder credentials.
          EV_CALCULATOR_KEYSTORE_PATH: ${{ runner.temp }}/lint-placeholder.keystore
          EV_CALCULATOR_KEYSTORE_PASSWORD: lint-only-placeholder
          EV_CALCULATOR_KEY_ALIAS: lint-only-placeholder
          EV_CALCULATOR_KEY_PASSWORD: lint-only-placeholder
        run: gradle --no-daemon assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ev-calculator-pro-pr-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android Lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-pr-report-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Android Lint
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.lint.outcome }}" = "success" ]; then
            echo "Android Lint task completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Android Lint reported findings or failed. Review the uploaded report; this step is non-blocking to preserve the existing warning policy." >> "$GITHUB_STEP_SUMMARY"
          fi
