<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cabecera con imagen real</title>
  <style>
    :root {
      --bg: #edf4ff;
      --card: rgba(255,255,255,0.84);
      --primary: #2d6efd;
      --text: #162942;
      --muted: #687e9c;
      --line: rgba(120, 142, 180, 0.18);
      --shadow: 0 20px 46px rgba(17, 33, 56, 0.10);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #edf4ff 0%, #f8fbff 100%);
      font-family: Inter, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .phone {
      width: 1280px;
      max-width: 95vw;
      height: 720px;
      background: linear-gradient(180deg, #f7fbff 0%, #ecf3ff 100%);
      border-radius: 26px;
      overflow: hidden;
      border: 1px solid rgba(122, 139, 172, 0.18);
      box-shadow: var(--shadow);
      position: relative;
    }

    .header-image {
      position: relative;
      width: 100%;
      height: 470px;
      overflow: hidden;
      background: linear-gradient(180deg, #dfeefb 0%, #edf5ff 100%);
      border-bottom: 1px solid rgba(121, 141, 176, 0.08);
    }

    .header-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.95) contrast(1.04);
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 0 18px 20px;
      margin-top: -38px;
    }

    .card {
      width: 100%;
      background: rgba(255,255,255,0.78);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 16px 30px rgba(19, 34, 60, 0.05);
      backdrop-filter: blur(8px);
      padding: 18px 18px 14px;
    }

    .title {
      margin: 0;
      font-size: clamp(32px, 3vw, 58px);
      line-height: 1;
      letter-spacing: -0.06em;
      font-weight: 900;
      color: var(--text);
    }

    .field {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }

    .label {
      flex: 1;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .input {
      width: 118px;
      height: 46px;
      border-radius: 12px;
      background: rgba(246, 250, 255, 0.95);
      border: 1px solid rgba(140, 160, 196, 0.18);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 19px;
      color: var(--text);
    }

    .unit {
      width: 70px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .meter {
      position: relative;
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: rgba(125, 145, 180, 0.12);
      overflow: hidden;
      margin-top: 18px;
    }

    .meter span {
      position: absolute;
      left: 0;
      top: 0;
      width: 58%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2d67ff 0%, #67a8ff 52%, #4ed8bd 100%);
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header-image">
      <img src="./coche-carga.jpg" alt="Coche EV cargando" />
    </div>

    <div class="content">
      <div class="card">
        <h1 class="title">Batería</h1>

        <div class="field">
          <div class="label">Capacidad</div>
          <div class="input">80,0</div>
          <div class="unit">kWh</div>
        </div>

        <div class="meter"><span></span></div>
      </div>
    </div>
  </div>
</body>
</html>
