<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock con imagen arriba</title>
  <style>
    :root {
      --bg-1: #edf4ff;
      --bg-2: #f8fbff;
      --card: rgba(255,255,255,0.78);
      --primary: #2e6bff;
      --primary-soft: rgba(46,107,255,0.10);
      --text: #152841;
      --muted: #697d9b;
      --line: rgba(126, 146, 182, 0.18);
      --shadow: 0 20px 42px rgba(18, 35, 61, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #edf4ff 0%, #f8fbff 100%);
      font-family: Inter, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 34px;
      overflow: hidden;
      border: 1px solid rgba(118, 138, 180, 0.18);
      box-shadow: var(--shadow);
      background: linear-gradient(180deg, #f8fbff 0%, #edf4ff 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(18px);
      opacity: 0.8;
    }

    .orb.one { width: 260px; height: 260px; background: rgba(46,107,255,0.12); left: -60px; top: 70px; }
    .orb.two { width: 300px; height: 300px; background: rgba(74,205,176,0.10); right: -70px; top: 220px; }
    .orb.three { width: 280px; height: 280px; background: rgba(150, 170, 255, 0.08); left: 80px; bottom: -80px; }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 18px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .title {
      flex: 1;
      text-align: center;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .theme {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(46,107,255,0.08);
      color: var(--primary);
      font-size: 20px;
      font-weight: 700;
    }

    .image-panel {
      position: relative;
      height: 170px;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(233,241,255,0.85));
      box-shadow: 0 18px 30px rgba(20, 34, 59, 0.04);
    }

    .image-panel .img-box {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.04em;
      background:
        linear-gradient(125deg, rgba(255,255,255,0.05), rgba(46,107,255,0.04)),
        radial-gradient(circle at 25% 30%, rgba(98, 149, 255, 0.2), transparent 32%),
        linear-gradient(180deg, #dfeaff 0%, #edf4ff 100%);
    }

    .image-panel .img-box::before {
      content: "IMAGEN / ILLUSTRATION";
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(130,149,180,0.24);
      letter-spacing: 0.12em;
      font-size: 10px;
      font-weight: 800;
    }

    .image-panel .label {
      position: absolute;
      left: 14px;
      bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(130,149,180,0.20);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
    }

    .image-panel .label::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(180deg, #67d9be, #2ea681);
      box-shadow: 0 0 0 4px rgba(62, 192, 166, 0.12);
    }

    .card {
      background: rgba(255,255,255,0.72);
      border-radius: 22px;
      border: 1px solid var(--line);
      padding: 18px 18px 16px;
      box-shadow: 0 14px 30px rgba(20, 34, 59, 0.04);
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.03em;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .label {
      flex: 1;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .input {
      width: 92px;
      height: 42px;
      border-radius: 12px;
      background: rgba(246,250,255,0.95);
      border: 1px solid rgba(138,160,196,0.18);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
    }

    .unit {
      width: 52px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .meter {
      width: 100%;
      height: 10px;
      margin-top: 8px;
      border-radius: 999px;
      background: rgba(128, 146, 179, 0.12);
      position: relative;
      overflow: hidden;
    }

    .meter > span {
      position: absolute;
      left: 0;
      top: 0;
      width: 55%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2d67ff 0%, #66a8ff 55%, #47d5ba 100%);
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <div class="content">
      <div class="topbar">
        <div style="width:40px"></div>
        <div class="title">EV Charge Calculator</div>
        <div class="theme">☾</div>
      </div>

      <div class="image-panel">
        <div class="img-box"></div>
        <div class="label">Hero image</div>
      </div>

      <div class="card">
        <div class="section-title">Batería</div>
        <div class="field">
          <div class="label">Capacidad</div>
          <div class="input">80,0</div>
          <div class="unit">kWh</div>
        </div>
        <div class="meter"><span></span></div>
      </div>
    </div>
  </div>
</body>
</html>
