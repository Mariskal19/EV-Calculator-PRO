plugins {
    id 'com.android.application'
}

android {
    namespace 'com.evchargecalculator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.evchargecalculator'
        minSdk 23
        targetSdk 35
        versionCode 49
        versionName 'v1.1.4'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
