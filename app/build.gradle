plugins { id 'com.android.application' }

android {
    namespace 'com.evchargecalculator'
    compileSdk 35
    defaultConfig {
        applicationId 'com.evchargecalculator'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }
}

tasks.register('prepareNamedApk', Copy) {
    dependsOn 'assembleDebug'
    from layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
    into layout.buildDirectory.dir('outputs/apk/debug')
    rename { 'EVChargeCalculator.apk' }
}
